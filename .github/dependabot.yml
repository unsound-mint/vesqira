# Keeps the commit-pinned actions, the lockfiles and the Go modules current, so pinning does not mean going stale.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: gomod
    directory: /services/api
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /apps/web
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /e2e
    schedule: {interval: weekly}
  - package-ecosystem: cargo
    directory: /apps/desktop
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directory: /services/scientific-worker
    schedule: {interval: weekly}
