name: e2e
# The browser walk-through is slower than the checks job, so it runs on main and on demand, not on every pull request.
# Run `make e2e` locally before merging.
on:
  push:
    branches: [main]
    paths: ['apps/**', 'services/**', 'fixtures/**', 'e2e/**', 'design/**', '.github/workflows/e2e.yml']
  workflow_dispatch:
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  walkthrough:
    runs-on: ubuntu-24.04 # Playwright 1.56 does not support the newer ubuntu-latest image
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/scientific-worker/requirements.txt
      - run: pip install -r services/scientific-worker/requirements.txt
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-traces
          path: e2e/test-results
          retention-days: 7
