name: e2e
# The browser walk-through runs on every pull request that touches the app, so a change that breaks it cannot merge
# unnoticed (it once stayed red on main for four merges when it ran only after merging).
on:
  pull_request:
    paths: ['apps/**', 'services/**', 'fixtures/**', 'e2e/**', 'design/**', '.github/workflows/e2e.yml']
  push:
    branches: [main]
    paths: ['apps/**', 'services/**', 'fixtures/**', 'e2e/**', 'design/**', '.github/workflows/e2e.yml']
  workflow_dispatch:
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  walkthrough:
    runs-on: ubuntu-24.04 # Playwright 1.56 does not support the newer ubuntu-latest image
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/scientific-worker/requirements.txt
      - run: pip install -r services/scientific-worker/requirements.txt
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: e2e/test-results
          retention-days: 7
