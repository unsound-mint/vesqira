name: e2e
# The browser walk-through is slower than the checks job, so it runs on main and on demand, not on every pull request.
# Run `make e2e` locally before merging.
on:
  push:
    branches: [main]
    paths: ['apps/**', 'services/**', 'fixtures/**', 'e2e/**', 'design/**', '.github/workflows/e2e.yml']
  workflow_dispatch:
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  walkthrough:
    runs-on: ubuntu-24.04 # Playwright 1.56 does not support the newer ubuntu-latest image
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fixtures/requirements.txt
      - run: pip install -r fixtures/requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: e2e/test-results
          retention-days: 7
