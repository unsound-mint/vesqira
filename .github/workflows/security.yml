name: security
# The app reads untrusted FITS files and runs three runtimes, so known-vulnerable dependencies are checked on every
# change to them and weekly (an advisory can appear without any commit).
on:
  pull_request:
    paths:
      - services/**
      - apps/web/package*.json
      - .github/workflows/security.yml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4 && govulncheck ./...
        working-directory: services/api
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high
        working-directory: apps/web
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.9.0 && pip-audit -r services/scientific-worker/requirements.txt
