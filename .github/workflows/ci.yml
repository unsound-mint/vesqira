name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.f.outputs.web }}
      fixtures: ${{ steps.f.outputs.fixtures }}
      api: ${{ steps.f.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: make docs
      # PR checkouts are merge commits and main uses squash merges, so HEAD^1 is the comparison base.
      - id: f
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(apps/web/|design/|Makefile$|\.github/workflows/ci\.yml$)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(fixtures/|Makefile$|\.github/workflows/ci\.yml$)'; then
            echo "fixtures=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(services/|fixtures/|tools/bench|Makefile$|\.github/workflows/ci\.yml$)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          fi

  # The three jobs below run side by side, so the slowest one sets the time.
  fixtures:
    needs: changes
    if: needs.changes.outputs.fixtures == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fixtures/requirements.txt
      - run: pip install -r fixtures/requirements.txt
      - run: make fixtures

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fixtures/requirements.txt
      - run: pip install -r fixtures/requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: make api
      # Generous budgets: this catches a change that makes the worker several times slower, not machine noise.
      - run: make bench

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: make web
