name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.f.outputs.web }}
      fixtures: ${{ steps.f.outputs.fixtures }}
      api: ${{ steps.f.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - run: make docs
      # PR checkouts are merge commits and main uses squash merges, so HEAD^1 is the comparison base.
      - id: f
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(apps/web/|design/|packages/contracts/|tools/contracts\.py$|Makefile$|\.github/workflows/ci\.yml$)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(fixtures/|services/scientific-worker/requirements\.txt$|Makefile$|\.github/workflows/ci\.yml$)'; then
            echo "fixtures=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(services/|fixtures/|packages/contracts/|tools/|Makefile$|\.github/workflows/ci\.yml$)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          fi

  # The three jobs below run side by side, so the slowest one sets the time.
  fixtures:
    needs: changes
    if: needs.changes.outputs.fixtures == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/scientific-worker/requirements.txt
      - run: pip install -r services/scientific-worker/requirements.txt
      - run: make fixtures

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20 # the server package alone runs about six minutes on a hosted runner, plus the benchmark
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/scientific-worker/requirements.txt
      - run: pip install -r services/scientific-worker/requirements.txt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: make api
      # Generous budgets: this catches a change that makes the worker several times slower, not machine noise.
      - run: make bench

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: make web
