name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: make docs
      # PR checkouts are merge commits and main uses squash merges, so HEAD^1 is the comparison base.
      - id: f
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(apps/web/|design/|Makefile$|\.github/workflows/ci\.yml$)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(fixtures/|Makefile$|\.github/workflows/ci\.yml$)'; then
            echo "fixtures=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.f.outputs.fixtures == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fixtures/requirements.txt
      - if: steps.f.outputs.fixtures == 'true'
        run: pip install -r fixtures/requirements.txt && make fixtures
      - if: steps.f.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - if: steps.f.outputs.web == 'true'
        run: npm ci
        working-directory: apps/web
      - if: steps.f.outputs.web == 'true'
        run: make web
