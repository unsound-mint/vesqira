<title>Vesqira Workbench Tokens</title>

<style>
/* Layout concept: prototype B (rail, explorer, canvas, bottom timeline) with a stacked right inspector.

:root{
  /* type */
  --font-ui:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif; --font-data:'Geist Mono',ui-monospace,'JetBrains Mono',monospace;
  --text-xs:12px; --text-sm:13px; --text-md:14px; --text-lg:16px; --text-xl:20px;
  --lh-xs:16px; --lh-sm:18px; --lh-md:20px; --lh-lg:24px; --lh-xl:28px;
  --w-regular:400; --w-medium:500; --w-strong:600;
  /* space: 4px grid */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px;
  /* controls */
  --ctl-sm:28px; --ctl-md:32px; --ctl-lg:40px; --row:28px; --pill:22px; --strip:44px; --icon-sm:16px; --icon-md:20px; --rail-btn:40px;
  /* radius, borders, motion */
  --r-sm:4px; --r-md:6px; --r-lg:8px; --r-pill:999px; --bw:1px;
  --dur-fast:100ms; --dur-base:160ms; --ease:cubic-bezier(.2,.0,.0,1);
  /* layout */
  --w-rail:48px; --w-side:280px; --w-insp:360px; --h-status:28px; --h-title:40px;
  /* colour: dark-first (cool slate + cyan) */
  --bg-0:#0a0e13; --bg-1:#0f151c; --bg-2:#141c25; --bg-3:#1a242f; --canvas:#06080c;
  --line:#222d39; --line-strong:#2f3d4c;
  --text:#e7ecf2; --text-2:#a7b3c1; --text-3:#7f8c9b;
  --accent:#3cc4e8; --accent-hover:#6fd6f0; --accent-ink:#04202a; --accent-bg:rgba(60,196,232,.14);
  --ok:#4cc38a; --ok-bg:rgba(76,195,138,.14); --warn:#f0b04c; --warn-bg:rgba(240,176,76,.14); --err:#ff7b7b; --err-bg:rgba(255,123,123,.14);
  --focus:#7cd8f2; --shadow:0 8px 28px rgba(0,0,0,.5);

}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg-0:#e9edf2; --bg-1:#f3f6f9; --bg-2:#ffffff; --bg-3:#eef2f6; --canvas:#0b0e13;
  --line:#d8dfe7; --line-strong:#bcc7d3; --text:#0e1620; --text-2:#455364; --text-3:#5b6877;
  --accent:#0a6f8f; --accent-hover:#065a75; --accent-ink:#ffffff; --accent-bg:rgba(10,111,143,.10);
  --ok:#0b7a52; --ok-bg:rgba(11,122,82,.10); --warn:#8f5700; --warn-bg:rgba(143,87,0,.10); --err:#b3261e; --err-bg:rgba(179,38,30,.08);
  --focus:#0a6f8f; --shadow:0 8px 28px rgba(14,22,32,.18); color-scheme:light}}

  --line:#d8dfe7; --line-strong:#bcc7d3; --text:#0e1620; --text-2:#455364; --text-3:#5b6877;

*{box-sizing:border-box}

  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;overflow:auto}

/* prototype chrome */
.proto{display:flex;gap:var(--sp-2);align-items:center;padding:0 var(--sp-3);height:var(--h-title);background:var(--bg-0);border-bottom:var(--bw) solid var(--line);flex:none}

.ph{display:flex;align-items:center;justify-content:space-between;height:var(--ctl-md);padding:0 var(--sp-3);font-size:var(--text-xs);line-height:var(--lh-xs);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:var(--w-strong)}

.sb[hidden]{display:none}
.fld{display:grid;grid-template-columns:88px minmax(0,1fr);gap:var(--sp-2);align-items:center;font-size:var(--text-md)}

.inp,.sel2{height:var(--ctl-md);width:100%;padding:0 var(--sp-2);border-radius:var(--r-md);border:var(--bw) solid var(--line-strong);background:var(--bg-0);font-size:var(--text-sm)}

.selw{position:relative;width:100%}.selw select{-webkit-appearance:none;appearance:none;padding-right:var(--sp-8);cursor:pointer}
.selw .ch{position:absolute;right:var(--sp-2);top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-3);display:grid}
.ico{display:block;flex:none}

.demo{display:flex;gap:var(--sp-4);align-items:flex-end;flex-wrap:wrap}
.bars{display:flex;gap:var(--sp-3);align-items:flex-end;flex-wrap:wrap}
.bars span{display:block;background:var(--accent-bg);border:var(--bw) solid var(--accent);border-radius:2px}
@media (max-width:1100px){.wb{grid-template-columns:var(--w-rail) minmax(0,1fr);grid-template-rows:auto auto var(--h-status);height:auto}.side{display:none}.insp{grid-column:1/-1;border-left:0;border-top:var(--bw) solid var(--line)}.main{min-height:560px}.sp-row{grid-template-columns:1fr}}
