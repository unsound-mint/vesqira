components:
  schemas:
    Error:
      type: "object"
      required:
        - "error"
      properties:
        error:
          type: "string"
        reasons:
          type: "array"
          items:
            type: "string"
    Axis:
      type: "object"
      required:
        - "axis"
        - "length"
        - "ctype"
        - "ctype_status"
        - "cunit"
        - "cunit_status"
        - "crval"
        - "crval_status"
        - "crpix"
        - "crpix_status"
        - "cdelt"
        - "cdelt_status"
      description: "One FITS axis as the file declares it. A status of unresolved means the keyword is absent; the value is then null, never a default."
      properties:
        axis:
          type: "integer"
          description: "1-based FITS axis number"
        length:
          type: "integer"
        ctype:
          type: "string"
          nullable: true
        ctype_status:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
        cunit:
          type: "string"
          nullable: true
        cunit_status:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
        crval:
          type: "number"
          nullable: true
        crval_status:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
        crpix:
          type: "number"
          nullable: true
        crpix_status:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
        cdelt:
          type: "number"
          nullable: true
        cdelt_status:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
    Beam:
      type: "object"
      required:
        - "status"
      properties:
        bmaj:
          type: "number"
        bmin:
          type: "number"
        bpa:
          type: "number"
        status:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
        note:
          type: "string"
    FitsHeader:
      type: "object"
      description: "Header facts the worker read from the file when it was registered. Extra keys may be present and are not part of the contract."
      required:
        - "naxis"
        - "bitpix"
        - "axes"
        - "bunit"
        - "bunit_status"
        - "specsys"
        - "radesys"
      properties:
        naxis:
          type: "integer"
        bitpix:
          type: "integer"
          nullable: true
        axes:
          type: "array"
          items:
            $ref: "#/components/schemas/Axis"
        bunit:
          type: "string"
          nullable: true
        bunit_status:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
        specsys:
          type: "string"
          nullable: true
        radesys:
          type: "string"
          nullable: true
        beam:
          $ref: "#/components/schemas/Beam"
    Interpretation:
      type: "object"
      description: "What the user declared about the data; the file itself declares none of it."
      required:
        - "kind"
        - "unit"
        - "reliabilityId"
        - "frame"
        - "quantity"
        - "declaredBy"
        - "declaredAt"
        - "stale"
      properties:
        kind:
          type: "string"
          enum:
            - "axial_orientation"
        unit:
          type: "string"
          enum:
            - "deg"
            - "rad"
        reliabilityId:
          type: "integer"
          nullable: true
          format: "int64"
        frame:
          type: "string"
          nullable: true
          enum:
            - "pixel"
            - "sky"
          description: "What the angle is measured against: pixel (counter-clockwise from +axis 1 towards +axis 2 as stored) or sky (east of north in the file's own celestial frame). Null means not declared; the file never says."
        quantity:
          type: "string"
          nullable: true
          enum:
            - "b_field"
            - "gradient"
            - "dust_polarization"
            - "starlight_polarization"
            - "unspecified"
          description: "What the angle describes. A gradient and dust polarization are perpendicular to B, starlight polarization and the B-field itself are not. Null means not declared."
        declaredBy:
          type: "string"
        declaredAt:
          type: "string"
          format: "date-time"
        stale:
          type: "boolean"
    Dataset:
      type: "object"
      description: "A registered dataset: a reference to the original file plus header facts. The file itself is never altered."
      required:
        - "id"
        - "path"
        - "name"
        - "sizeBytes"
        - "modifiedAt"
        - "addedAt"
        - "header"
        - "hostId"
        - "nature"
        - "interpretation"
        - "unitDeclaration"
        - "kind"
        - "catalogDeclaration"
      properties:
        id:
          type: "integer"
          format: "int64"
        path:
          type: "string"
        name:
          type: "string"
        sizeBytes:
          type: "integer"
          format: "int64"
        modifiedAt:
          type: "string"
          format: "date-time"
        addedAt:
          type: "string"
          format: "date-time"
        header:
          oneOf:
            - $ref: "#/components/schemas/FitsHeader"
            - $ref: "#/components/schemas/CatalogHeader"
          description: "FitsHeader when kind is fits, CatalogHeader when kind is catalog"
        hostId:
          type: "integer"
          format: "int64"
          description: "0 for a file on this computer, otherwise the remote host that holds it"
        nature:
          type: "string"
          enum:
            - ""
            - "observed"
            - "simulated"
            - "constructed_control"
          description: "Empty means not declared"
        interpretation:
          allOf:
            - $ref: "#/components/schemas/Interpretation"
          nullable: true
        unitDeclaration:
          allOf:
            - $ref: "#/components/schemas/UnitDeclaration"
          nullable: true
          description: "Present when the person declared a unit for a file without BUNIT. The header's own bunit and bunit_status stay as the file gave them."
        kind:
          type: "string"
          enum:
            - "fits"
            - "catalog"
          description: "An image or cube (fits) or a table of sources (catalog, ADR 0044)"
        catalogDeclaration:
          allOf:
            - $ref: "#/components/schemas/CatalogDeclaration"
          nullable: true
          description: "What the person declared about a catalog's columns; null for anything else"
    DatasetList:
      type: "object"
      required:
        - "datasets"
      properties:
        datasets:
          type: "array"
          items:
            $ref: "#/components/schemas/Dataset"
    SkyPixel:
      type: "object"
      required:
        - "kind"
        - "note"
      properties:
        kind:
          type: "string"
          enum:
            - "pixel"
        note:
          type: "string"
    SkyCelestial:
      type: "object"
      required:
        - "kind"
        - "lon_name"
        - "lat_name"
        - "projection"
        - "frame"
        - "frame_status"
        - "unit"
      properties:
        kind:
          type: "string"
          enum:
            - "celestial"
        lon_name:
          type: "string"
        lat_name:
          type: "string"
        projection:
          type: "string"
          nullable: true
        frame:
          type: "string"
          nullable: true
        frame_status:
          type: "string"
          enum:
            - "declared"
            - "inferred"
            - "unresolved"
        unit:
          type: "string"
          enum:
            - "deg"
    SpectralFacts:
      type: "object"
      required:
        - "fits_axis"
        - "ctype"
        - "name"
        - "is_spectral"
        - "resolved"
        - "unit"
        - "unit_status"
        - "velocity"
      properties:
        fits_axis:
          type: "integer"
        ctype:
          type: "string"
          nullable: true
        name:
          type: "string"
        is_spectral:
          type: "boolean"
        resolved:
          type: "boolean"
        unit:
          type: "string"
          nullable: true
        unit_status:
          type: "string"
          enum:
            - "declared"
            - "inferred"
            - "unresolved"
        velocity:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
        note:
          type: "string"
        specsys:
          type: "string"
          nullable: true
        restfrq:
          type: "number"
          nullable: true
    Flags:
      type: "object"
      required:
        - "declared"
        - "channels"
      description: "Data-provider channel flags. Flagged channels keep their data; declared false means the file states no flags at all."
      properties:
        declared:
          type: "boolean"
        source:
          type: "string"
        channels:
          type: "array"
          items:
            type: "integer"
        note:
          type: "string"
    View:
      type: "object"
      description: "What the viewer needs to lay out a dataset: image size, which FITS axes are x, y and channel, and the sky and spectral readouts with their provenance."
      required:
        - "width"
        - "height"
        - "channels"
        - "bunit"
        - "bunit_status"
        - "fits_axes"
        - "sky"
        - "spectral"
        - "flags"
      properties:
        width:
          type: "integer"
        height:
          type: "integer"
        channels:
          type: "integer"
        bunit:
          type: "string"
          nullable: true
        bunit_status:
          type: "string"
          enum:
            - "declared"
            - "user"
            - "unresolved"
          description: "declared: the file's BUNIT; user: a unit the person declared for a file with none (never the file's); unresolved: neither"
        fits_axes:
          type: "object"
          required:
            - "x"
            - "y"
            - "channel"
          properties:
            x:
              type: "integer"
            y:
              type: "integer"
            channel:
              type: "integer"
              nullable: true
        sky:
          oneOf:
            - $ref: "#/components/schemas/SkyPixel"
            - $ref: "#/components/schemas/SkyCelestial"
          discriminator:
            propertyName: "kind"
            mapping:
              pixel: "#/components/schemas/SkyPixel"
              celestial: "#/components/schemas/SkyCelestial"
        spectral:
          allOf:
            - $ref: "#/components/schemas/SpectralFacts"
          nullable: true
        flags:
          $ref: "#/components/schemas/Flags"
    PlaneStats:
      type: "object"
      required:
        - "finite_count"
        - "nonfinite_count"
        - "min"
        - "max"
        - "p01"
        - "p99"
        - "overflow_count"
      properties:
        finite_count:
          type: "integer"
        nonfinite_count:
          type: "integer"
        min:
          type: "number"
          nullable: true
        max:
          type: "number"
          nullable: true
        p01:
          type: "number"
          nullable: true
        p99:
          type: "number"
          nullable: true
        overflow_count:
          type: "integer"
    PlaneHeader:
      type: "object"
      description: "The JSON header of a plane frame. NaN in the payload means no value, never zero. Extra keys may be present and are not part of the contract."
      required:
        - "width"
        - "height"
        - "channel"
        - "channels"
        - "nan_meaning"
        - "stats"
        - "spectral_value"
        - "spectral_unit"
        - "flagged"
        - "source_bitpix"
        - "scaled"
      properties:
        width:
          type: "integer"
        height:
          type: "integer"
        channel:
          type: "integer"
        channels:
          type: "integer"
        nan_meaning:
          type: "string"
        stats:
          $ref: "#/components/schemas/PlaneStats"
        spectral_value:
          type: "number"
          nullable: true
        spectral_unit:
          type: "string"
          nullable: true
        flagged:
          type: "boolean"
          nullable: true
          description: "null means the file declares no flags at all, which is not the same as not flagged."
        source_bitpix:
          type: "integer"
          nullable: true
        scaled:
          type: "boolean"
        preview:
          type: "object"
          nullable: true
          description: "Present on a reduced display preview: not for measurement; the full-resolution plane follows."
          required:
            - "step"
            - "source_width"
            - "source_height"
            - "method"
          properties:
            step:
              type: "integer"
            source_width:
              type: "integer"
            source_height:
              type: "integer"
            method:
              type: "string"
    UnitDeclaration:
      type: "object"
      description: "The physical unit a person declared for a file whose header has no BUNIT. An overlay: the file and its header facts are never changed, and wherever the unit is shown it is labelled as declared by the person."
      required:
        - "unit"
        - "declaredBy"
        - "declaredAt"
        - "stale"
      properties:
        unit:
          type: "string"
          description: "As typed: 1 to 40 printable characters. It is shown and compared as text and not converted."
        declaredBy:
          type: "string"
          description: "\"user\""
        declaredAt:
          type: "string"
          format: "date-time"
        stale:
          type: "boolean"
          description: "The file's size or modification time differs from when the unit was declared: it may no longer describe these bytes."
    Capabilities:
      type: "object"
      description: "What this running server can do, so a client can show a feature as unavailable instead of failing on a 404."
      required:
        - "app"
        - "protocol"
        - "schema"
        - "features"
        - "limits"
      properties:
        app:
          type: "object"
          required:
            - "name"
            - "version"
          properties:
            name:
              type: "string"
            version:
              type: "string"
              description: "\"dev\" for a plain build"
        protocol:
          type: "integer"
          description: "Changes only when an existing route or field changes meaning in a way an older client would misread"
        schema:
          type: "integer"
          description: "Version of the local data schema"
        features:
          type: "object"
          required:
            - "planes"
            - "planeCache"
            - "preview"
            - "hosts"
            - "jobs"
            - "analysis"
            - "remoteAnalysis"
            - "runs"
            - "boards"
            - "regions"
            - "audit"
            - "editor"
          properties:
            planes:
              type: "boolean"
            planeCache:
              type: "boolean"
            preview:
              type: "boolean"
            hosts:
              type: "boolean"
            jobs:
              type: "boolean"
            analysis:
              type: "boolean"
            remoteAnalysis:
              type: "boolean"
            runs:
              type: "boolean"
            boards:
              type: "boolean"
            regions:
              type: "boolean"
            audit:
              type: "boolean"
            editor:
              type: "boolean"
              description: "The text editor for local files is on (--enable-editor, ADR 0029)."
          description: "True when this running server was started with what the feature needs"
        limits:
          type: "object"
          required:
            - "previewStepMax"
            - "metricsPerRunMax"
          properties:
            previewStepMax:
              type: "integer"
            metricsPerRunMax:
              type: "integer"
    FigureAxis:
      type: "object"
      description: "An axis as the file declared it; null means the file did not say."
      required:
        - "axis"
        - "length"
        - "ctype"
        - "cunit"
        - "crval"
        - "cdelt"
      properties:
        axis:
          type: "integer"
        length:
          type: "integer"
        ctype:
          type: "string"
          nullable: true
        cunit:
          type: "string"
          nullable: true
        crval:
          type: "number"
          nullable: true
        cdelt:
          type: "number"
          nullable: true
    FigureHeader:
      type: "object"
      description: "Header facts declared by the file and not verified; null means absent."
      required:
        - "axes"
        - "bunit"
        - "radesys"
        - "specsys"
        - "bitpix"
      properties:
        axes:
          type: "array"
          items:
            $ref: "#/components/schemas/FigureAxis"
        bunit:
          type: "string"
          nullable: true
        radesys:
          type: "string"
          nullable: true
        specsys:
          type: "string"
          nullable: true
        bitpix:
          type: "integer"
          nullable: true
    FigureRegion:
      type: "object"
      description: "Pixel region; rect uses x0,y0,x1,y1 and circle uses cx,cy,r."
      required:
        - "shape"
      properties:
        shape:
          type: "string"
          enum:
            - "rect"
            - "circle"
        x0:
          type: "integer"
        y0:
          type: "integer"
        x1:
          type: "integer"
        y1:
          type: "integer"
        cx:
          type: "integer"
        cy:
          type: "integer"
        r:
          type: "integer"
    FigureView:
      type: "object"
      description: "What a figure shows. Unknown keys are refused, so nothing else can ride along into a reviewer's view."
      required:
        - "kind"
      properties:
        kind:
          type: "string"
          enum:
            - "plane"
            - "spectrum"
            - "orientation"
        channel:
          type: "integer"
          minimum: 0
        spectralValue:
          type: "number"
        spectralUnit:
          type: "string"
          description: "At most 16 characters of letters, digits and / * ^ . - space"
        region:
          $ref: "#/components/schemas/FigureRegion"
        colormap:
          type: "string"
          enum:
            - "viridis"
            - "inferno"
            - "gray"
            - "twilight"
        stretch:
          type: "string"
          enum:
            - "linear"
            - "sqrt"
            - "asinh"
        range:
          type: "string"
          enum:
            - "percentile"
            - "minmax"
            - "custom"
        limits:
          type: "array"
          items:
            type: "number"
          maxItems: 2
        limitsUnit:
          type: "string"
          description: "Must be the file's BUNIT, or the unit the author declared for a file without one"
        showLines:
          type: "boolean"
    FigureInterpretation:
      type: "object"
      description: "The orientation meaning declared for the file, said to be the author's or the import adapter's, never the file's."
      required:
        - "kind"
        - "unit"
        - "declaredBy"
        - "hasReliabilityMap"
      properties:
        kind:
          type: "string"
        unit:
          type: "string"
        declaredBy:
          type: "string"
        hasReliabilityMap:
          type: "boolean"
    FigureUnitDeclaration:
      type: "object"
      description: "The brightness unit the author declared because the file has no BUNIT."
      required:
        - "unit"
        - "declaredBy"
      properties:
        unit:
          type: "string"
        declaredBy:
          type: "string"
    RunParam:
      type: "object"
      required:
        - "key"
        - "value"
        - "source"
      properties:
        key:
          type: "string"
        value:
          type: "string"
        source:
          type: "string"
          enum:
            - "config"
            - "run_parameters"
    RunMetric:
      type: "object"
      description: "One measured result of a run, as the run's metadata declares it."
      required:
        - "key"
        - "value"
        - "unit"
        - "uncertainty"
        - "uncertaintyKind"
        - "n"
        - "definition"
        - "status"
      properties:
        key:
          type: "string"
        value:
          type: "number"
          nullable: true
          description: "Null when not recorded; never zero"
        unit:
          type: "string"
        uncertainty:
          type: "number"
          nullable: true
        uncertaintyKind:
          type: "string"
          enum:
            - ""
            - "standard_deviation"
            - "standard_error"
            - "confidence_68"
            - "confidence_95"
            - "other"
          description: "Empty when the run did not say; it is not guessed"
        n:
          type: "integer"
          format: "int64"
          nullable: true
        definition:
          type: "string"
        status:
          type: "string"
          enum:
            - "declared"
    RunReview:
      type: "object"
      description: "The researcher's own assessment, kept apart from whether the computation finished."
      required:
        - "qc"
        - "interpretation"
        - "note"
      properties:
        qc:
          type: "string"
          enum:
            - "not_assessed"
            - "passed"
            - "failed"
            - "inconclusive"
        interpretation:
          type: "string"
          enum:
            - "not_interpreted"
            - "supports"
            - "challenges"
            - "inconclusive"
        note:
          type: "string"
    RunSummary:
      type: "object"
      description: "The run that produced a dataset, without paths, ids or locations."
      required:
        - "name"
        - "kind"
        - "role"
        - "gitCommit"
        - "dirty"
        - "reproducibleFromCommit"
        - "generatedAt"
        - "params"
        - "metrics"
        - "review"
      properties:
        name:
          type: "string"
        kind:
          type: "string"
        role:
          type: "string"
        gitCommit:
          type: "string"
        dirty:
          type: "boolean"
        reproducibleFromCommit:
          type: "boolean"
        generatedAt:
          type: "string"
        params:
          type: "array"
          items:
            $ref: "#/components/schemas/RunParam"
        metrics:
          type: "array"
          items:
            $ref: "#/components/schemas/RunMetric"
        review:
          $ref: "#/components/schemas/RunReview"
    DerivedSummary:
      type: "object"
      description: "How a derived dataset was made; sources are file names."
      required:
        - "op"
        - "params"
        - "sources"
        - "policy"
        - "software"
        - "createdAt"
      properties:
        op:
          type: "string"
        params:
          description: "Operation parameters, as recorded; free-form JSON"
        sources:
          type: "array"
          items:
            type: "string"
        policy:
          type: "string"
        software:
          description: "Software identity, as recorded; free-form JSON"
        createdAt:
          type: "string"
          format: "date-time"
    FigureProvenance:
      type: "object"
      description: "Reviewer-safe account of where a figure came from. It has no path and no dataset id."
      required:
        - "source"
        - "view"
        - "statements"
      properties:
        source:
          type: "object"
          description: "The source file by name only; no path and no dataset id."
          required:
            - "name"
            - "sizeBytes"
            - "modifiedAt"
            - "identity"
            - "headerDeclaredByFile"
          properties:
            name:
              type: "string"
            sizeBytes:
              type: "integer"
              format: "int64"
            modifiedAt:
              type: "string"
              format: "date-time"
            identity:
              type: "string"
            headerDeclaredByFile:
              $ref: "#/components/schemas/FigureHeader"
        interpretation:
          $ref: "#/components/schemas/FigureInterpretation"
        unitDeclaration:
          $ref: "#/components/schemas/FigureUnitDeclaration"
        nature:
          type: "string"
          enum:
            - "observed"
            - "simulated"
            - "constructed_control"
          description: "As declared by the author; absent when not declared"
        run:
          $ref: "#/components/schemas/RunSummary"
        derived:
          $ref: "#/components/schemas/DerivedSummary"
        view:
          $ref: "#/components/schemas/FigureView"
        statements:
          type: "array"
          items:
            type: "string"
    Figure:
      type: "object"
      description: "Pinned evidence: the picture and the facts it was made from do not change. Title and caption are working text and may be edited."
      required:
        - "id"
        - "datasetId"
        - "title"
        - "caption"
        - "createdAt"
        - "revision"
        - "previewSha"
        - "width"
        - "height"
        - "provenance"
      properties:
        id:
          type: "integer"
          format: "int64"
        datasetId:
          type: "integer"
          format: "int64"
        title:
          type: "string"
        caption:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        revision:
          type: "string"
        previewSha:
          type: "string"
        width:
          type: "integer"
        height:
          type: "integer"
        provenance:
          $ref: "#/components/schemas/FigureProvenance"
        archived:
          type: "boolean"
          description: "Hidden from the lists by default; still resolves by id (ADR 0041)."
        scene:
          allOf:
            - $ref: "#/components/schemas/Scene"
          description: "The scene the picture was drawn from (ADR 0042); absent for figures saved before scenes. Owner API only: it names dataset ids, so it is never part of the reviewer-safe provenance."
    FigureList:
      type: "object"
      required:
        - "figures"
      properties:
        figures:
          type: "array"
          items:
            $ref: "#/components/schemas/Figure"
    CreateFigureRequest:
      type: "object"
      required:
        - "datasetId"
        - "title"
        - "view"
        - "previewPng"
      properties:
        datasetId:
          type: "integer"
          format: "int64"
        title:
          type: "string"
        caption:
          type: "string"
        view:
          $ref: "#/components/schemas/FigureView"
        previewPng:
          type: "string"
          format: "byte"
          description: "The picture as the author's browser drew it, PNG, base64"
        scene:
          $ref: "#/components/schemas/Scene"
    FigureTextRequest:
      type: "object"
      description: "Unknown keys are refused."
      required:
        - "title"
      properties:
        title:
          type: "string"
        caption:
          type: "string"
    JobProgress:
      type: "object"
      required:
        - "done"
        - "total"
        - "etaSeconds"
      properties:
        done:
          type: "integer"
        total:
          type: "integer"
        etaSeconds:
          type: "integer"
          format: "int64"
          nullable: true
          description: "An estimate at the rate so far; null when there is nothing to base it on"
    JobInfo:
      type: "object"
      description: "What the owner's board shows about a followed job. A reviewer never gets it."
      required:
        - "id"
        - "name"
        - "state"
        - "submittedAt"
        - "finishedAt"
        - "runId"
      properties:
        id:
          type: "integer"
          format: "int64"
        name:
          type: "string"
        state:
          type: "string"
          enum:
            - "draft"
            - "submitting"
            - "submitted"
            - "running"
            - "completed"
            - "failed"
            - "cancelled"
            - "unknown"
          description: "unknown when the job no longer exists"
        submittedAt:
          type: "string"
          format: "date-time"
          nullable: true
        finishedAt:
          type: "string"
          format: "date-time"
          nullable: true
        runId:
          type: "integer"
          format: "int64"
          nullable: true
        progress:
          $ref: "#/components/schemas/JobProgress"
          description: "Present only when the job's log says how far it is"
        label:
          type: "string"
          description: "For a job of a parameter sweep: N = 12, λ = 10. Owner only; a snapshot never carries it"
        sweepId:
          type: "integer"
          format: "int64"
          description: "The sweep the job belongs to, if any"
    FigureBoardItem:
      type: "object"
      required:
        - "position"
        - "kind"
        - "figure"
        - "note"
      properties:
        position:
          type: "integer"
        kind:
          type: "string"
          enum:
            - "figure"
        figure:
          $ref: "#/components/schemas/Figure"
        note:
          type: "string"
    JobBoardItem:
      type: "object"
      description: "A panel that follows a job and becomes its result when pinned."
      required:
        - "position"
        - "kind"
        - "job"
        - "note"
      properties:
        position:
          type: "integer"
        kind:
          type: "string"
          enum:
            - "job"
        job:
          $ref: "#/components/schemas/JobInfo"
        note:
          type: "string"
    BoardItem:
      oneOf:
        - $ref: "#/components/schemas/FigureBoardItem"
        - $ref: "#/components/schemas/JobBoardItem"
      discriminator:
        propertyName: "kind"
        mapping:
          figure: "#/components/schemas/FigureBoardItem"
          job: "#/components/schemas/JobBoardItem"
    Board:
      type: "object"
      required:
        - "id"
        - "title"
        - "createdAt"
        - "updatedAt"
        - "items"
      properties:
        id:
          type: "integer"
          format: "int64"
        title:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/BoardItem"
        archived:
          type: "boolean"
          description: "Hidden from the lists by default; still resolves by id (ADR 0041)."
    BoardList:
      type: "object"
      required:
        - "boards"
      properties:
        boards:
          type: "array"
          items:
            $ref: "#/components/schemas/Board"
    CreateBoardRequest:
      type: "object"
      description: "Unknown keys are refused."
      required:
        - "title"
      properties:
        title:
          type: "string"
    BoardAddItemRequest:
      type: "object"
      description: "Give exactly one of figureId and jobId; both or neither is refused with 422."
      properties:
        figureId:
          type: "integer"
          format: "int64"
        jobId:
          type: "integer"
          format: "int64"
    BoardPinRequest:
      type: "object"
      description: "The figure made from the result of the job a panel follows."
      required:
        - "figureId"
      properties:
        figureId:
          type: "integer"
          format: "int64"
    BoardMoveRequest:
      type: "object"
      required:
        - "delta"
      properties:
        delta:
          type: "integer"
          enum:
            - -1
            - 1
    BoardNoteRequest:
      type: "object"
      required:
        - "note"
      properties:
        note:
          type: "string"
    Snapshot:
      type: "object"
      description: "A frozen, published version of a board. Optional fields are omitted when empty."
      required:
        - "id"
        - "boardId"
        - "label"
        - "createdAt"
        - "expiresAt"
        - "revoked"
        - "items"
        - "outcome"
        - "comments"
      properties:
        id:
          type: "integer"
          format: "int64"
        boardId:
          type: "integer"
          format: "int64"
        label:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        expiresAt:
          type: "string"
          format: "date-time"
        revoked:
          type: "boolean"
        items:
          type: "integer"
        question:
          type: "string"
        outcome:
          type: "string"
          enum:
            - ""
            - "commented"
            - "changes_requested"
            - "reviewed"
          description: "What the reviewer said about this version; empty means not yet reviewed. Not a scientific assessment of any run."
        outcomeNote:
          type: "string"
        outcomeBy:
          type: "string"
        outcomeAt:
          type: "string"
          format: "date-time"
        supersededBy:
          type: "integer"
          format: "int64"
        comments:
          type: "integer"
          description: "Reviewers' comments, not the author's replies"
        lastActivity:
          type: "string"
          format: "date-time"
    SnapshotList:
      type: "object"
      required:
        - "snapshots"
      properties:
        snapshots:
          type: "array"
          items:
            $ref: "#/components/schemas/Snapshot"
    FrozenFigure:
      type: "object"
      description: "A figure as a reviewer sees it. kind is omitted for a figure."
      required:
        - "revision"
        - "title"
        - "caption"
        - "note"
        - "previewSha"
        - "width"
        - "height"
        - "provenance"
      properties:
        kind:
          type: "string"
          enum:
            - "figure"
        revision:
          type: "string"
        title:
          type: "string"
        caption:
          type: "string"
        note:
          type: "string"
        previewSha:
          type: "string"
        width:
          type: "integer"
        height:
          type: "integer"
        provenance:
          $ref: "#/components/schemas/FigureProvenance"
    FrozenJob:
      type: "object"
      description: "A run that had not finished: only its name and state at that moment."
      required:
        - "kind"
        - "title"
        - "state"
        - "at"
        - "note"
      properties:
        kind:
          type: "string"
          enum:
            - "job"
        title:
          type: "string"
        state:
          type: "string"
          description: "As of at; it never changes"
        at:
          type: "string"
          format: "date-time"
        note:
          type: "string"
    FrozenItem:
      oneOf:
        - $ref: "#/components/schemas/FrozenFigure"
        - $ref: "#/components/schemas/FrozenJob"
    Frozen:
      type: "object"
      description: "Everything a reviewer may see of a board: there is no path, dataset id or credential field."
      required:
        - "boardTitle"
        - "label"
        - "createdAt"
        - "expiresAt"
        - "items"
      properties:
        boardTitle:
          type: "string"
        label:
          type: "string"
        question:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        expiresAt:
          type: "string"
          format: "date-time"
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/FrozenItem"
    Preflight:
      type: "object"
      description: "What publishing would expose and what a careful author would want to know first. Creates nothing."
      required:
        - "frozen"
        - "warnings"
      properties:
        frozen:
          $ref: "#/components/schemas/Frozen"
        warnings:
          type: "array"
          items:
            type: "string"
    PublishRequest:
      type: "object"
      description: "Unknown keys are refused."
      properties:
        label:
          type: "string"
        question:
          type: "string"
        hours:
          type: "number"
          description: "Lifetime of the link; 0 or absent means 14 days; beyond 90 days is refused"
        supersedes:
          type: "integer"
          format: "int64"
          description: "The snapshot this one replaces"
        reason:
          type: "string"
    PublishResponse:
      type: "object"
      required:
        - "snapshot"
        - "token"
        - "reviewPath"
        - "note"
      properties:
        snapshot:
          $ref: "#/components/schemas/Snapshot"
        token:
          type: "string"
          description: "Shown once; only its hash is kept"
        reviewPath:
          type: "string"
        note:
          type: "string"
    TextVersion:
      type: "object"
      required:
        - "size"
        - "mtime"
        - "sha256"
      description: "A text file as the editor saw it (ADR 0029). A save must send these three values from when the file was opened; all three must still match the file on disk."
      properties:
        size:
          type: "integer"
          format: "int64"
          description: "bytes"
        mtime:
          type: "string"
          description: "modification time in nanoseconds since the epoch, as a decimal string (a JSON number would lose digits in a browser)"
        sha256:
          type: "string"
          description: "hex SHA-256 of the file bytes"
    TextFile:
      type: "object"
      required:
        - "path"
        - "name"
        - "content"
        - "size"
        - "mtime"
        - "sha256"
      description: "A text file inside a source root, opened for editing."
      properties:
        path:
          type: "string"
          description: "canonical path, symbolic links resolved"
        name:
          type: "string"
        content:
          type: "string"
          description: "UTF-8 text, at most 2 MiB"
        size:
          type: "integer"
          format: "int64"
        mtime:
          type: "string"
        sha256:
          type: "string"
    TextSave:
      type: "object"
      required:
        - "path"
        - "content"
        - "base"
      properties:
        path:
          type: "string"
          description: "absolute path of an existing file; a save never creates one"
        content:
          type: "string"
        base:
          $ref: "#/components/schemas/TextVersion"
    TextConflict:
      type: "object"
      required:
        - "error"
        - "current"
      description: "The file changed on disk since it was opened. Nothing was written; current is what is on disk now."
      properties:
        error:
          type: "string"
        current:
          $ref: "#/components/schemas/TextFile"
    Notification:
      type: "object"
      required:
        - "id"
        - "at"
        - "kind"
        - "title"
        - "body"
        - "jobId"
        - "runId"
        - "read"
      description: "One event for the owner. The words say what Slurm or the importer reported; a finished job is never called a success, because it has not been checked."
      properties:
        id:
          type: "integer"
          format: "int64"
        at:
          type: "string"
          format: "date-time"
        kind:
          type: "string"
          enum:
            - "completed"
            - "failed"
            - "cancelled"
            - "timeout"
            - "unknown"
            - "imported"
            - "import_failed"
          description: "How the job ended (the first five; unknown means Slurm no longer lists it and Vesqira did not mark it finished), or what happened to its results (the last two)"
        title:
          type: "string"
        body:
          type: "string"
        jobId:
          type: "integer"
          format: "int64"
          nullable: true
        runId:
          type: "integer"
          format: "int64"
          nullable: true
          description: "The run the results were imported as (kind imported)"
        read:
          type: "boolean"
    NotificationList:
      type: "object"
      required:
        - "notifications"
        - "unread"
      properties:
        notifications:
          type: "array"
          items:
            $ref: "#/components/schemas/Notification"
          description: "Newest first"
        unread:
          type: "integer"
          description: "Unread events in all, not only among those returned"
    NotificationsReadRequest:
      type: "object"
      description: "Mark events read: by id, or all of them. Unknown keys are refused."
      properties:
        ids:
          type: "array"
          maxItems: 500
          items:
            type: "integer"
            format: "int64"
        all:
          type: "boolean"
    AnchorPoint:
      type: "object"
      required:
        - "kind"
        - "x"
        - "y"
      description: "A point on the published picture, in fractions of its width and height from the top left (0 to 1). It refers to the picture as drawn, not to a sky position."
      properties:
        kind:
          type: "string"
          enum:
            - "point"
        x:
          type: "number"
        y:
          type: "number"
    AnchorBox:
      type: "object"
      required:
        - "kind"
        - "x"
        - "y"
        - "x1"
        - "y1"
      description: "A box on the published picture; (x, y) is the top left corner and (x1, y1) the opposite one, with x < x1 and y < y1."
      properties:
        kind:
          type: "string"
          enum:
            - "box"
        x:
          type: "number"
        y:
          type: "number"
        x1:
          type: "number"
        y1:
          type: "number"
    Anchor:
      oneOf:
        - $ref: "#/components/schemas/AnchorPoint"
        - $ref: "#/components/schemas/AnchorBox"
      discriminator:
        propertyName: "kind"
        mapping:
          point: "#/components/schemas/AnchorPoint"
          box: "#/components/schemas/AnchorBox"
    Comment:
      type: "object"
      required:
        - "id"
        - "figureRevision"
        - "parentId"
        - "author"
        - "fromOwner"
        - "body"
        - "createdAt"
      description: "A reviewer's comment, or the author's reply, in a thread on one figure of a snapshot."
      properties:
        id:
          type: "integer"
          format: "int64"
        figureRevision:
          type: "string"
        parentId:
          type: "integer"
          format: "int64"
          description: "0 for the first comment of a thread"
        author:
          type: "string"
        fromOwner:
          type: "boolean"
        body:
          type: "string"
        anchor:
          $ref: "#/components/schemas/Anchor"
        createdAt:
          type: "string"
          format: "date-time"
        resolvedAt:
          type: "string"
          format: "date-time"
          description: "Set on a thread's first comment when the author closes it"
    CommentList:
      type: "object"
      required:
        - "comments"
      properties:
        comments:
          type: "array"
          items:
            $ref: "#/components/schemas/Comment"
    ReviewCommentRequest:
      type: "object"
      required:
        - "body"
      description: "A new thread needs figureRevision (a figure of this snapshot) and may carry an anchor; a reply names parentId instead and takes the thread's figure, with no anchor. author defaults to Reviewer."
      properties:
        figureRevision:
          type: "string"
        parentId:
          type: "integer"
          format: "int64"
        author:
          type: "string"
          maxLength: 80
        body:
          type: "string"
        anchor:
          $ref: "#/components/schemas/Anchor"
    OwnerReplyRequest:
      type: "object"
      required:
        - "parentId"
        - "body"
      additionalProperties: false
      properties:
        parentId:
          type: "integer"
          format: "int64"
          description: "The first comment of the thread being answered"
        body:
          type: "string"
    OutcomeValue:
      type: "string"
      enum:
        - "commented"
        - "changes_requested"
        - "reviewed"
      description: "What the reviewer thought of the review itself; not a scientific assessment of any run."
    OutcomeRequest:
      type: "object"
      required:
        - "outcome"
      properties:
        outcome:
          $ref: "#/components/schemas/OutcomeValue"
        note:
          type: "string"
          maxLength: 1000
        author:
          type: "string"
          maxLength: 80
    Outcome:
      type: "object"
      required:
        - "value"
      properties:
        value:
          type: "string"
          enum:
            - ""
            - "commented"
            - "changes_requested"
            - "reviewed"
          description: "Empty: not yet reviewed"
        note:
          type: "string"
        by:
          type: "string"
        at:
          type: "string"
          format: "date-time"
    Superseded:
      type: "object"
      required:
        - "reason"
        - "at"
      description: "Set when the author has replaced this version; the link keeps working."
      properties:
        reason:
          type: "string"
        at:
          type: "string"
          format: "date-time"
    Review:
      type: "object"
      required:
        - "snapshot"
        - "comments"
        - "outcome"
      description: "Everything a reviewer's browser receives for one link."
      properties:
        snapshot:
          $ref: "#/components/schemas/Frozen"
        comments:
          type: "array"
          items:
            $ref: "#/components/schemas/Comment"
        outcome:
          $ref: "#/components/schemas/Outcome"
        superseded:
          $ref: "#/components/schemas/Superseded"
    Revoked:
      type: "object"
      required:
        - "revoked"
      properties:
        revoked:
          type: "boolean"
    Resolved:
      type: "object"
      required:
        - "resolved"
      properties:
        resolved:
          type: "boolean"
    ResolveRequest:
      type: "object"
      required:
        - "resolved"
      additionalProperties: false
      properties:
        resolved:
          type: "boolean"
    Scene:
      type: "object"
      additionalProperties: false
      description: "What one pane draws (ADR 0042, section 3): a base plane with its display settings, overlays drawn over it in order, and the part of the image in view. A figure stores the scene it was drawn from. Versioned by schema; a change that is not additive gets a new version."
      required:
        - "schema"
        - "base"
        - "overlays"
        - "view"
      properties:
        schema:
          type: "string"
          enum:
            - "scene/1"
        base:
          $ref: "#/components/schemas/SceneBase"
        overlays:
          type: "array"
          maxItems: 16
          items:
            $ref: "#/components/schemas/SceneOverlay"
          description: "Drawn in this order over the base, the first at the bottom"
        view:
          $ref: "#/components/schemas/SceneView"
    SceneBase:
      type: "object"
      additionalProperties: false
      required:
        - "datasetId"
        - "channel"
        - "display"
      properties:
        datasetId:
          type: "integer"
          format: "int64"
          minimum: 1
        channel:
          type: "integer"
          minimum: 0
          description: "0-based index along the spectral axis; 0 for a single plane"
        spectral:
          $ref: "#/components/schemas/SceneSpectral"
        display:
          $ref: "#/components/schemas/SceneDisplay"
    SceneSpectral:
      type: "object"
      additionalProperties: false
      description: "The channel's spectral world value as the worker reported it for that channel; absent when the axis is unresolved or the plane is not read yet. Never computed in the browser."
      required:
        - "value"
        - "unit"
      properties:
        value:
          type: "number"
        unit:
          type: "string"
          maxLength: 16
    SceneDisplay:
      type: "object"
      additionalProperties: false
      required:
        - "mapping"
        - "colormap"
        - "stretch"
        - "range"
      description: "How base values become colours. For mapping axial (a declared orientation map) the angles are drawn with the cyclic twilight map, 0° = 180°, and stretch, range and limits do not apply."
      properties:
        mapping:
          type: "string"
          enum:
            - "scalar"
            - "axial"
        colormap:
          type: "string"
          enum:
            - "viridis"
            - "inferno"
            - "gray"
            - "twilight"
        stretch:
          type: "string"
          enum:
            - "linear"
            - "sqrt"
            - "asinh"
        range:
          type: "string"
          enum:
            - "percentile"
            - "minmax"
            - "custom"
        limits:
          type: "array"
          items:
            type: "number"
          minItems: 2
          maxItems: 2
          description: "The custom limits, lower then upper, finite; required when range is custom. With another range the limits come from the plane's finite pixels, and these, when present, are only remembered for switching back to custom."
        limitsUnit:
          type: "string"
          maxLength: 64
          description: "The unit of the custom limits: the file's BUNIT, or the unit the author declared for a file without one"
        scaleGroup:
          type: "string"
          pattern: "^[A-Za-z0-9_-]{1,32}$"
          description: "Panes in the same group share one colour scale (ADR 0027)"
    SceneView:
      type: "object"
      additionalProperties: false
      required:
        - "zoom"
      description: "The part of the image in view, independent of the screen: the window of width/zoom by height/zoom image pixels around centre is shown whole and as large as the pane allows."
      properties:
        zoom:
          type: "number"
          minimum: 1
          maximum: 16
          description: "1 is the whole image fitted to the pane"
        centre:
          $ref: "#/components/schemas/ScenePoint"
    ScenePoint:
      type: "object"
      additionalProperties: false
      required:
        - "x"
        - "y"
      description: "Image coordinates: x from the left edge, y from the bottom edge, in pixels (pixel i covers i to i+1). An absent centre means the image centre."
      properties:
        x:
          type: "number"
          minimum: 0
          maximum: 1000000
        y:
          type: "number"
          minimum: 0
          maximum: 1000000
    SceneRegion:
      oneOf:
        - $ref: "#/components/schemas/SceneRect"
        - $ref: "#/components/schemas/SceneCircle"
      discriminator:
        propertyName: "shape"
        mapping:
          rect: "#/components/schemas/SceneRect"
          circle: "#/components/schemas/SceneCircle"
    SceneRect:
      type: "object"
      additionalProperties: false
      required:
        - "shape"
        - "x0"
        - "y0"
        - "x1"
        - "y1"
      description: "Inclusive 0-based pixel bounds, y from the bottom"
      properties:
        shape:
          type: "string"
          enum:
            - "rect"
        x0:
          type: "integer"
          minimum: -1000000
          maximum: 1000000
        y0:
          type: "integer"
          minimum: -1000000
          maximum: 1000000
        x1:
          type: "integer"
          minimum: -1000000
          maximum: 1000000
        y1:
          type: "integer"
          minimum: -1000000
          maximum: 1000000
    SceneCircle:
      type: "object"
      additionalProperties: false
      required:
        - "shape"
        - "cx"
        - "cy"
        - "r"
      description: "Centre pixel (0-based, y from the bottom) and radius in pixels; holds the pixels whose centres are within r"
      properties:
        shape:
          type: "string"
          enum:
            - "circle"
        cx:
          type: "integer"
          minimum: -1000000
          maximum: 1000000
        cy:
          type: "integer"
          minimum: -1000000
          maximum: 1000000
        r:
          type: "integer"
          minimum: 0
          maximum: 1000000
    SceneOverlay:
      oneOf:
        - $ref: "#/components/schemas/OrientationOverlay"
        - $ref: "#/components/schemas/RegionsOverlay"
        - $ref: "#/components/schemas/ContoursOverlay"
        - $ref: "#/components/schemas/CatalogOverlay"
        - $ref: "#/components/schemas/BeamOverlay"
        - $ref: "#/components/schemas/GridOverlay"
      discriminator:
        propertyName: "kind"
        mapping:
          orientation: "#/components/schemas/OrientationOverlay"
          regions: "#/components/schemas/RegionsOverlay"
          contours: "#/components/schemas/ContoursOverlay"
          catalog: "#/components/schemas/CatalogOverlay"
          beam: "#/components/schemas/BeamOverlay"
          grid: "#/components/schemas/GridOverlay"
      description: "One layer over the base. Only orientation (of the base map itself) and regions are drawn in this version; the other kinds are specified for the slices that add them, and a figure refuses them until then."
    OrientationOverlay:
      type: "object"
      additionalProperties: false
      description: "Orientation lines of an axial map, sampled on its grid. In this version datasetId is the base map."
      required:
        - "id"
        - "kind"
        - "datasetId"
        - "visible"
        - "sampling"
        - "length"
        - "opacity"
      properties:
        id:
          type: "string"
          pattern: "^[A-Za-z0-9_-]{1,32}$"
          description: "Stable within the scene; actions name an overlay by it"
        kind:
          type: "string"
          enum:
            - "orientation"
        datasetId:
          type: "integer"
          format: "int64"
          minimum: 1
        visible:
          type: "boolean"
        sampling:
          oneOf:
            - $ref: "#/components/schemas/SamplingAuto"
            - $ref: "#/components/schemas/SamplingStep"
          discriminator:
            propertyName: "mode"
            mapping:
              auto: "#/components/schemas/SamplingAuto"
              step: "#/components/schemas/SamplingStep"
        length:
          type: "string"
          enum:
            - "fixed"
          description: "fixed: 0.8 of the sampling step"
        opacity:
          type: "string"
          enum:
            - "reliability"
            - "uniform"
          description: "reliability: follows a reliability map on the same grid relative to its 99th percentile, faint where unknown; uniform: every line opaque. A figure records which was used."
        reliabilityId:
          type: "integer"
          format: "int64"
          minimum: 1
          description: "The reliability map that set the opacities. A figure states it whenever opacity is reliability, and it must be the map declared with the orientation map."
    SamplingAuto:
      type: "object"
      additionalProperties: false
      required:
        - "mode"
        - "gapPx"
      description: "A step in image pixels chosen so that lines are about gapPx output pixels apart"
      properties:
        mode:
          type: "string"
          enum:
            - "auto"
        gapPx:
          type: "number"
          minimum: 4
          maximum: 256
    SamplingStep:
      type: "object"
      additionalProperties: false
      required:
        - "mode"
        - "step"
      description: "Every step-th image pixel; a figure records the step it drew"
      properties:
        mode:
          type: "string"
          enum:
            - "step"
        step:
          type: "integer"
          minimum: 1
          maximum: 4096
    RegionsOverlay:
      type: "object"
      additionalProperties: false
      description: "Pixel regions of the base map: the working region, and saved regions with their shapes as drawn (a saved region can be edited later, so its shape is copied)."
      required:
        - "id"
        - "kind"
        - "datasetId"
        - "visible"
        - "saved"
      properties:
        id:
          type: "string"
          pattern: "^[A-Za-z0-9_-]{1,32}$"
          description: "Stable within the scene; actions name an overlay by it"
        kind:
          type: "string"
          enum:
            - "regions"
        datasetId:
          type: "integer"
          format: "int64"
          minimum: 1
        visible:
          type: "boolean"
        active:
          $ref: "#/components/schemas/SceneRegion"
        saved:
          type: "array"
          maxItems: 256
          items:
            $ref: "#/components/schemas/SceneSavedRegion"
    SceneSavedRegion:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "shape"
      properties:
        id:
          type: "integer"
          format: "int64"
          minimum: 1
        shape:
          $ref: "#/components/schemas/SceneRegion"
        selected:
          type: "boolean"
    ContoursOverlay:
      type: "object"
      additionalProperties: false
      description: "Specified, not drawn yet: contours of a map traced on its own grid and placed by WCS."
      required:
        - "id"
        - "kind"
        - "datasetId"
        - "visible"
        - "channel"
        - "levels"
        - "unit"
      properties:
        id:
          type: "string"
          pattern: "^[A-Za-z0-9_-]{1,32}$"
          description: "Stable within the scene; actions name an overlay by it"
        kind:
          type: "string"
          enum:
            - "contours"
        datasetId:
          type: "integer"
          format: "int64"
          minimum: 1
        visible:
          type: "boolean"
        channel:
          type: "integer"
          minimum: 0
        levels:
          oneOf:
            - $ref: "#/components/schemas/LevelsList"
            - $ref: "#/components/schemas/LevelsLinear"
            - $ref: "#/components/schemas/LevelsGeometric"
          discriminator:
            propertyName: "mode"
            mapping:
              list: "#/components/schemas/LevelsList"
              linear: "#/components/schemas/LevelsLinear"
              geometric: "#/components/schemas/LevelsGeometric"
        unit:
          type: "string"
          maxLength: 64
          description: "The overlay dataset's own brightness unit"
    LevelsList:
      type: "object"
      additionalProperties: false
      required:
        - "mode"
        - "values"
      properties:
        mode:
          type: "string"
          enum:
            - "list"
        values:
          type: "array"
          minItems: 1
          maxItems: 64
          items:
            type: "number"
    LevelsLinear:
      type: "object"
      additionalProperties: false
      required:
        - "mode"
        - "start"
        - "step"
        - "count"
      properties:
        mode:
          type: "string"
          enum:
            - "linear"
        start:
          type: "number"
        step:
          type: "number"
        count:
          type: "integer"
          minimum: 1
          maximum: 64
    LevelsGeometric:
      type: "object"
      additionalProperties: false
      required:
        - "mode"
        - "start"
        - "factor"
        - "count"
      properties:
        mode:
          type: "string"
          enum:
            - "geometric"
        start:
          type: "number"
        factor:
          type: "number"
          minimum: 1
          exclusiveMinimum: true
        count:
          type: "integer"
          minimum: 1
          maximum: 64
    CatalogOverlay:
      type: "object"
      additionalProperties: false
      description: "Specified, not drawn yet: markers from a catalog dataset, placed by WCS after converting between celestial frames."
      required:
        - "id"
        - "kind"
        - "datasetId"
        - "visible"
        - "columns"
      properties:
        id:
          type: "string"
          pattern: "^[A-Za-z0-9_-]{1,32}$"
          description: "Stable within the scene; actions name an overlay by it"
        kind:
          type: "string"
          enum:
            - "catalog"
        datasetId:
          type: "integer"
          format: "int64"
          minimum: 1
        visible:
          type: "boolean"
        columns:
          type: "object"
          additionalProperties: false
          required:
            - "lon"
            - "lat"
          properties:
            lon:
              type: "string"
              minLength: 1
              maxLength: 64
            lat:
              type: "string"
              minLength: 1
              maxLength: 64
            angle:
              type: "string"
              minLength: 1
              maxLength: 64
            angleError:
              type: "string"
              minLength: 1
              maxLength: 64
    BeamOverlay:
      type: "object"
      additionalProperties: false
      description: "Specified, not drawn yet: the beam from the header's BMAJ, BMIN and BPA only, never a default."
      required:
        - "id"
        - "kind"
        - "datasetId"
        - "visible"
      properties:
        id:
          type: "string"
          pattern: "^[A-Za-z0-9_-]{1,32}$"
          description: "Stable within the scene; actions name an overlay by it"
        kind:
          type: "string"
          enum:
            - "beam"
        datasetId:
          type: "integer"
          format: "int64"
          minimum: 1
        visible:
          type: "boolean"
    GridOverlay:
      type: "object"
      additionalProperties: false
      description: "Specified, not drawn yet: a coordinate grid in the dataset's own celestial frame."
      required:
        - "id"
        - "kind"
        - "datasetId"
        - "visible"
      properties:
        id:
          type: "string"
          pattern: "^[A-Za-z0-9_-]{1,32}$"
          description: "Stable within the scene; actions name an overlay by it"
        kind:
          type: "string"
          enum:
            - "grid"
        datasetId:
          type: "integer"
          format: "int64"
          minimum: 1
        visible:
          type: "boolean"
    CatalogColumn:
      type: "object"
      properties:
        name:
          type: "string"
        dtype:
          type: "string"
          enum:
            - "float"
            - "int"
            - "bool"
            - "string"
            - "other"
        unit:
          type: "string"
          nullable: true
          description: "Only when the file declares it (ECSV meta, VOTable unit, FITS TUNITn). Never inferred from the name."
        scalar:
          type: "boolean"
          description: "False for a column of arrays: it is listed but cannot be used as a position, angle or value."
      required:
        - "name"
        - "dtype"
        - "unit"
        - "scalar"
      description: "One column of a point catalog as the worker read it."
    CatalogHeader:
      type: "object"
      properties:
        kind:
          type: "string"
          enum:
            - "catalog"
        format:
          type: "string"
          enum:
            - "csv"
            - "tsv"
            - "text table"
            - "ecsv"
            - "ipac"
            - "votable"
            - "fits"
        rows:
          type: "integer"
        columns:
          type: "array"
          items:
            $ref: "#/components/schemas/CatalogColumn"
      required:
        - "kind"
        - "format"
        - "rows"
        - "columns"
      description: "What the worker read from a point catalog when it was registered (ADR 0044). The rows stay in the file."
    CatalogAngle:
      type: "object"
      properties:
        column:
          type: "string"
        unit:
          type: "string"
          enum:
            - "deg"
            - "rad"
          description: "Required: never guessed from the values."
        frame:
          type: "string"
          enum:
            - "sky"
          description: "A catalog has no pixel grid: the angle is a position angle east of north in the catalog's own celestial frame."
        quantity:
          type: "string"
          nullable: true
          enum:
            - "b_field"
            - "gradient"
            - "dust_polarization"
            - "starlight_polarization"
            - "unspecified"
            - null
          description: "What the angle describes, as for an orientation map. Null means not declared."
        sigmaColumn:
          type: "string"
          nullable: true
          description: "Column holding the angle's uncertainty, in the angle's unit."
      required:
        - "column"
        - "unit"
        - "frame"
        - "quantity"
        - "sigmaColumn"
    CatalogDeclarationRequest:
      type: "object"
      properties:
        lon:
          type: "string"
          description: "Longitude (right ascension, Galactic longitude, ...) column"
        lat:
          type: "string"
          description: "Latitude column"
        format:
          type: "string"
          enum:
            - "degrees"
            - "hours_degrees"
            - "sexagesimal_hours_degrees"
            - "sexagesimal_degrees"
          description: "How positions are written. hours_degrees is longitude in decimal hours and latitude in degrees; sexagesimal_hours_degrees is h m s and d m s."
        frame:
          type: "string"
          enum:
            - "icrs"
            - "fk5"
            - "fk4"
            - "galactic"
          description: "The celestial frame. Never assumed."
        equinox:
          type: "string"
          nullable: true
          description: "J2000-style for fk5, B1950-style for fk4; null for icrs and galactic."
        angle:
          allOf:
            - $ref: "#/components/schemas/CatalogAngle"
          nullable: true
          description: "An optional angle column (a position angle on the sky) with its unit, quantity and uncertainty."
        values:
          type: "array"
          maxItems: 8
          items:
            type: "string"
          description: "Further columns to show next to each source."
      required:
        - "lon"
        - "lat"
        - "format"
        - "frame"
        - "equinox"
        - "angle"
        - "values"
      description: "What a person declares about a catalog's columns. Validated against the table; unknown fields are refused."
    CatalogDeclaration:
      type: "object"
      properties:
        lon:
          type: "string"
          description: "Longitude (right ascension, Galactic longitude, ...) column"
        lat:
          type: "string"
          description: "Latitude column"
        format:
          type: "string"
          enum:
            - "degrees"
            - "hours_degrees"
            - "sexagesimal_hours_degrees"
            - "sexagesimal_degrees"
          description: "How positions are written. hours_degrees is longitude in decimal hours and latitude in degrees; sexagesimal_hours_degrees is h m s and d m s."
        frame:
          type: "string"
          enum:
            - "icrs"
            - "fk5"
            - "fk4"
            - "galactic"
          description: "The celestial frame. Never assumed."
        equinox:
          type: "string"
          nullable: true
          description: "J2000-style for fk5, B1950-style for fk4; null for icrs and galactic."
        angle:
          allOf:
            - $ref: "#/components/schemas/CatalogAngle"
          nullable: true
          description: "An optional angle column (a position angle on the sky) with its unit, quantity and uncertainty."
        values:
          type: "array"
          maxItems: 8
          items:
            type: "string"
          description: "Further columns to show next to each source."
        declaredBy:
          type: "string"
          description: "\"user\""
        declaredAt:
          type: "string"
          format: "date-time"
        stale:
          type: "boolean"
          description: "True when the file's size or modification time differs from when this was declared. A stale declaration is not applied: positions are refused until it is confirmed again."
      required:
        - "lon"
        - "lat"
        - "format"
        - "frame"
        - "equinox"
        - "angle"
        - "values"
        - "declaredBy"
        - "declaredAt"
        - "stale"
      description: "An overlay: the file and the columns the worker read are never changed."
    RegisterPathRequest:
      type: "object"
      properties:
        path:
          type: "string"
          description: "Absolute path inside a source root; resolved and authorised like a FITS registration"
      required:
        - "path"
    CatalogProposal:
      type: "object"
      properties:
        basis:
          type: "string"
          enum:
            - "proposed from the column names"
          description: "Always shown with the proposal. A proposal is never stored or applied until the person confirms it."
        lon:
          type: "string"
          nullable: true
        lat:
          type: "string"
          nullable: true
        format:
          type: "string"
          nullable: true
        format_basis:
          type: "string"
        frame:
          type: "string"
          nullable: true
        frame_basis:
          type: "string"
        equinox:
          type: "string"
          nullable: true
        angle:
          type: "object"
          nullable: true
          properties:
            column:
              type: "string"
            unit:
              type: "string"
              nullable: true
            unit_basis:
              type: "string"
              nullable: true
            quantity:
              type: "string"
              nullable: true
            quantity_basis:
              type: "string"
        sigma:
          type: "string"
          nullable: true
        notes:
          type: "array"
          items:
            type: "string"
          description: "What the names do not settle, for the person to choose."
      required:
        - "basis"
        - "lon"
        - "lat"
        - "format"
        - "frame"
        - "equinox"
        - "angle"
        - "sigma"
        - "notes"
    CatalogParseReport:
      type: "object"
      properties:
        rows:
          type: "integer"
        placed:
          type: "integer"
          description: "Rows whose longitude and latitude were both read"
        unreadable:
          type: "integer"
          description: "Rows with a longitude or latitude that is there but cannot be read; counted over the whole table"
        missing:
          type: "integer"
          description: "Rows with an empty longitude or latitude (not the same as unreadable), not counted above"
        samples:
          type: "array"
          items:
            type: "object"
            properties:
              row:
                type: "integer"
                description: "1-based row of the table"
              line:
                type: "integer"
                nullable: true
                description: "1-based line of the file (text tables); null for VOTable and FITS"
              column:
                type: "string"
              value:
                type: "string"
                description: "At most 40 characters of the value"
              reason:
                type: "string"
            required:
              - "row"
              - "line"
              - "column"
              - "value"
              - "reason"
          description: "The first unreadable values, with their line"
        lon:
          type: "object"
          properties:
            column:
              type: "string"
            missing:
              type: "integer"
            invalid:
              type: "integer"
            samples:
              type: "array"
              items:
                type: "object"
                properties:
                  row:
                    type: "integer"
                    description: "1-based row of the table"
                  line:
                    type: "integer"
                    nullable: true
                    description: "1-based line of the file (text tables); null for VOTable and FITS"
                  column:
                    type: "string"
                  value:
                    type: "string"
                    description: "At most 40 characters of the value"
                  reason:
                    type: "string"
                required:
                  - "row"
                  - "line"
                  - "column"
                  - "value"
                  - "reason"
          required:
            - "column"
            - "missing"
            - "invalid"
            - "samples"
        lat:
          type: "object"
          properties:
            column:
              type: "string"
            missing:
              type: "integer"
            invalid:
              type: "integer"
            samples:
              type: "array"
              items:
                type: "object"
                properties:
                  row:
                    type: "integer"
                    description: "1-based row of the table"
                  line:
                    type: "integer"
                    nullable: true
                    description: "1-based line of the file (text tables); null for VOTable and FITS"
                  column:
                    type: "string"
                  value:
                    type: "string"
                    description: "At most 40 characters of the value"
                  reason:
                    type: "string"
                required:
                  - "row"
                  - "line"
                  - "column"
                  - "value"
                  - "reason"
          required:
            - "column"
            - "missing"
            - "invalid"
            - "samples"
        angle:
          type: "object"
          properties:
            column:
              type: "string"
            missing:
              type: "integer"
            invalid:
              type: "integer"
            samples:
              type: "array"
              items:
                type: "object"
                properties:
                  row:
                    type: "integer"
                    description: "1-based row of the table"
                  line:
                    type: "integer"
                    nullable: true
                    description: "1-based line of the file (text tables); null for VOTable and FITS"
                  column:
                    type: "string"
                  value:
                    type: "string"
                    description: "At most 40 characters of the value"
                  reason:
                    type: "string"
                required:
                  - "row"
                  - "line"
                  - "column"
                  - "value"
                  - "reason"
          required:
            - "column"
            - "missing"
            - "invalid"
            - "samples"
        sigma:
          type: "object"
          properties:
            column:
              type: "string"
            missing:
              type: "integer"
            invalid:
              type: "integer"
            samples:
              type: "array"
              items:
                type: "object"
                properties:
                  row:
                    type: "integer"
                    description: "1-based row of the table"
                  line:
                    type: "integer"
                    nullable: true
                    description: "1-based line of the file (text tables); null for VOTable and FITS"
                  column:
                    type: "string"
                  value:
                    type: "string"
                    description: "At most 40 characters of the value"
                  reason:
                    type: "string"
                required:
                  - "row"
                  - "line"
                  - "column"
                  - "value"
                  - "reason"
          required:
            - "column"
            - "missing"
            - "invalid"
            - "samples"
      required:
        - "rows"
        - "placed"
        - "unreadable"
        - "missing"
        - "samples"
        - "lon"
        - "lat"
    CatalogReport:
      type: "object"
      properties:
        format:
          type: "string"
        rows:
          type: "integer"
        columns:
          type: "array"
          items:
            $ref: "#/components/schemas/CatalogColumn"
        preview:
          type: "object"
          properties:
            columns:
              type: "array"
              items:
                type: "string"
            rows:
              type: "array"
              items:
                type: "array"
                items:
                  nullable: true
          required:
            - "columns"
            - "rows"
          description: "The first rows. A missing value is null, never 0; text is cut at 64 characters."
        read:
          type: "object"
          properties:
            skippedTotal:
              type: "integer"
              description: "Lines that are not rows (wrong number of fields); each is listed with its line"
            skipped:
              type: "array"
              items:
                type: "object"
                properties:
                  line:
                    type: "integer"
                  reason:
                    type: "string"
                  text:
                    type: "string"
                required:
                  - "line"
                  - "reason"
                  - "text"
            headerless:
              type: "boolean"
            notes:
              type: "array"
              items:
                type: "string"
          required:
            - "skippedTotal"
            - "skipped"
            - "headerless"
            - "notes"
        proposal:
          $ref: "#/components/schemas/CatalogProposal"
        limits:
          type: "object"
          properties:
            fileBytes:
              type: "integer"
            rows:
              type: "integer"
            columns:
              type: "integer"
          required:
            - "fileBytes"
            - "rows"
            - "columns"
        declaration:
          allOf:
            - $ref: "#/components/schemas/CatalogDeclaration"
          nullable: true
        parse:
          allOf:
            - $ref: "#/components/schemas/CatalogParseReport"
          nullable: true
          description: "Present when a fresh declaration is in force"
        parseError:
          type: "string"
          nullable: true
          description: "Why the declaration could not be applied (stale, or too many sexagesimal values to place)"
      required:
        - "format"
        - "rows"
        - "columns"
        - "preview"
        - "read"
        - "proposal"
        - "limits"
        - "declaration"
        - "parse"
        - "parseError"
    CatalogRows:
      type: "object"
      properties:
        offset:
          type: "integer"
        total:
          type: "integer"
        columns:
          type: "array"
          items:
            type: "string"
        rows:
          type: "array"
          items:
            type: "array"
            items:
              nullable: true
          description: "Cells in column order; null is a missing value or a column of arrays"
        lines:
          type: "array"
          nullable: true
          items:
            type: "integer"
          description: "The file line of each row (text tables)"
      required:
        - "offset"
        - "total"
        - "columns"
        - "rows"
        - "lines"
    CatalogPositions:
      type: "object"
      properties:
        frame:
          type: "string"
          enum:
            - "icrs"
            - "fk5"
            - "fk4"
            - "galactic"
        equinox:
          type: "string"
          nullable: true
        offset:
          type: "integer"
        count:
          type: "integer"
        total:
          type: "integer"
        row:
          type: "array"
          items:
            type: "integer"
          description: "1-based row numbers"
        lon:
          type: "array"
          items:
            type: "number"
            nullable: true
          description: "Degrees in [0, 360); null for a row whose position could not be read, never 0"
        lat:
          type: "array"
          items:
            type: "number"
            nullable: true
          description: "Degrees; null as above"
        angle:
          type: "array"
          items:
            type: "number"
            nullable: true
          description: "Position angle in degrees east of north, in [0, 180) for an orientation quantity; null where missing"
          nullable: true
        sigma:
          type: "array"
          items:
            type: "number"
            nullable: true
          description: "Uncertainty in degrees"
        angleUnit:
          type: "string"
          enum:
            - "deg"
        angleQuantity:
          type: "string"
          nullable: true
        angleFrame:
          type: "string"
          enum:
            - "sky"
        angleAxial:
          type: "boolean"
        note:
          type: "string"
        report:
          $ref: "#/components/schemas/CatalogParseReport"
      required:
        - "frame"
        - "equinox"
        - "offset"
        - "count"
        - "total"
        - "row"
        - "lon"
        - "lat"
        - "report"
      description: "Positions in the declared frame, or in the frame asked for (transformed with astropy, angles carried with them)."
    QuotaEntry:
      type: "object"
      required:
        - "scope"
        - "usedBytes"
        - "softBytes"
        - "hardBytes"
        - "raw"
      properties:
        scope:
          type: "string"
          description: "storage pool, file system or mount the line is about"
        usedBytes:
          type: "integer"
          format: "int64"
        softBytes:
          type: "integer"
          format: "int64"
          nullable: true
          description: "null: the tool reports no soft limit"
        hardBytes:
          type: "integer"
          format: "int64"
          nullable: true
          description: "null: the tool reports no hard limit"
        raw:
          type: "string"
          description: "the line as the tool printed it (shortened), so the numbers can be compared with the cluster's own"
      description: "One line of a quota report. Sizes are powers of 1024, which is what each tool prints."
    HostQuota:
      type: "object"
      required:
        - "tool"
        - "command"
        - "entries"
      properties:
        tool:
          type: "string"
          enum:
            - "beegfs-ctl"
            - "lfs quota"
            - "quota"
          description: "which tool answered; tried in this order"
        command:
          type: "string"
        entries:
          type: "array"
          items:
            $ref: "#/components/schemas/QuotaEntry"
    HostFilesystem:
      type: "object"
      required:
        - "root"
        - "filesystem"
        - "mount"
        - "totalBytes"
        - "usedBytes"
        - "availBytes"
        - "raw"
      properties:
        root:
          type: "string"
          description: "one of the host's declared source roots"
        filesystem:
          type: "string"
        mount:
          type: "string"
        totalBytes:
          type: "integer"
          format: "int64"
        usedBytes:
          type: "integer"
          format: "int64"
        availBytes:
          type: "integer"
          format: "int64"
        raw:
          type: "string"
        error:
          type: "string"
          description: "present when df gave nothing usable for this root; the numbers are then 0 and mean nothing"
      description: "What `df -P -k` reported for a root. Free space is the file system's, not the user's allowance."
    HostStorageReport:
      type: "object"
      required:
        - "checkedAt"
        - "quota"
        - "quotaNote"
        - "filesystems"
      properties:
        checkedAt:
          type: "string"
          format: "date-time"
        quota:
          allOf:
            - $ref: "#/components/schemas/HostQuota"
          nullable: true
          description: "null when no quota tool answered readably"
        quotaNote:
          type: "string"
          description: "when quota is null: \"this site's quota tool is not available\", in words"
        filesystems:
          type: "array"
          items:
            $ref: "#/components/schemas/HostFilesystem"
    HostStorage:
      type: "object"
      required:
        - "report"
        - "error"
        - "checkedAt"
        - "cached"
      properties:
        report:
          allOf:
            - $ref: "#/components/schemas/HostStorageReport"
          nullable: true
          description: "the last good look; null if there has never been one"
        error:
          type: "string"
          description: "non-empty when the latest attempt failed (host unreachable); report is then the last good look, if any"
        checkedAt:
          type: "string"
          format: "date-time"
          nullable: true
          description: "when report was made"
        cached:
          type: "boolean"
          description: "true when no call was made to the host for this answer"
      description: "Quota and disk usage of a host (ADR 0045). A look is reused for 10 minutes; a failed one for 1 minute; Refresh cannot reach the host more than once per 15 seconds."
    RunFolder:
      type: "object"
      required:
        - "path"
        - "name"
        - "kind"
        - "jobId"
        - "bytes"
        - "partial"
        - "measuredAt"
      properties:
        path:
          type: "string"
        name:
          type: "string"
        kind:
          type: "string"
          enum:
            - "job"
            - "run"
          description: "a job's output folder, or a run folder found by scanning a project on the host"
        jobId:
          type: "integer"
          format: "int64"
          nullable: true
        bytes:
          type: "integer"
          format: "int64"
          nullable: true
          description: "null until measured; never 0 for unmeasured"
        partial:
          type: "boolean"
          description: "du could not read some entries, so bytes is a lower bound"
        measuredAt:
          type: "string"
          format: "date-time"
          nullable: true
    RunFolderList:
      type: "object"
      required:
        - "folders"
      properties:
        folders:
          type: "array"
          items:
            $ref: "#/components/schemas/RunFolder"
      description: "Run folders on a host, largest measured first. Listing makes no call to the host."
    FolderSizeRequest:
      type: "object"
      required:
        - "path"
      properties:
        path:
          type: "string"
          description: "an absolute folder inside one of the host's source roots"
    DiskUsage:
      type: "object"
      required:
        - "path"
        - "kib"
        - "bytes"
        - "partial"
        - "measuredAt"
      properties:
        path:
          type: "string"
        kib:
          type: "integer"
          format: "int64"
        bytes:
          type: "integer"
          format: "int64"
        partial:
          type: "boolean"
          description: "du could not read some entries: a lower bound"
        measuredAt:
          type: "string"
          format: "date-time"
      description: "`du -sk` of one folder: disk blocks used, not the sum of file lengths."
    RohsaRunView:
      type: "object"
      properties:
        runId:
          type: "integer"
          format: "int64"
        name:
          type: "string"
        nGauss:
          type: "integer"
          description: "Gaussians per pixel, as the run's records declare; 0 when they do not"
        nGaussBasis:
          type: "string"
        cropDatasetId:
          type: "integer"
          format: "int64"
        cropName:
          type: "string"
        cropBunit:
          type: "string"
          nullable: true
        isCrop:
          type: "boolean"
          description: "the dataset is the crop the fit used"
        usable:
          type: "boolean"
        refusal:
          type: "string"
          description: "why the components cannot be drawn over this dataset"
          nullable: true
      required:
        - "runId"
        - "name"
        - "nGauss"
        - "nGaussBasis"
        - "cropDatasetId"
        - "cropName"
        - "cropBunit"
        - "isCrop"
        - "usable"
        - "refusal"
      description: "A ROHSA decomposition run whose components could be drawn over a dataset: the dataset is the run's crop or exactly on its grid. A cube with the crop's axis lengths but another (or unconfirmed) grid is listed with the reason it is refused."
    RohsaRunList:
      type: "object"
      properties:
        runs:
          type: "array"
          items:
            $ref: "#/components/schemas/RohsaRunView"
      required:
        - "runs"
    RohsaIndexRequest:
      type: "object"
      properties:
        runId:
          type: "integer"
          format: "int64"
      required:
        - "runId"
    RohsaIndexState:
      type: "object"
      properties:
        ok:
          type: "boolean"
        op:
          type: "string"
        state:
          type: "string"
          enum:
            - "building"
            - "ready"
            - "refused"
        done_bytes:
          type: "integer"
        size_bytes:
          type: "integer"
        rows:
          type: "integer"
        malformed:
          type: "integer"
        reason:
          type: "string"
          nullable: true
        examples:
          type: "array"
          items:
            type: "object"
            properties:
              line:
                type: "integer"
              problem:
                type: "string"
            required:
              - "line"
              - "problem"
        index_bytes:
          type: "integer"
          description: "size of the sidecar index: 8 bytes per pixel"
        width:
          type: "integer"
        height:
          type: "integer"
      required:
        - "state"
        - "done_bytes"
        - "size_bytes"
        - "rows"
        - "malformed"
        - "reason"
        - "examples"
        - "index_bytes"
      description: "Progress of the index of a ROHSA .dat. building: call again; ready: pixels can be read; refused: the file is not the ROHSA row layout, with the reason and example lines."
    RohsaComponent:
      type: "object"
      properties:
        k:
          type: "integer"
          description: "1-based Gaussian number within the pixel, in file order"
        amp:
          type: "number"
          description: "fitted amplitude in the crop's brightness unit; 0 is a real value"
        mean_channel_file:
          type: "number"
          description: "the file's 1-based channel number"
        mean_channel:
          type: "number"
          description: "0-based channel index: the file's value minus 1"
        sigma_channel:
          type: "number"
        valid:
          type: "boolean"
          description: "false when sigma is not positive and finite; such a component is not drawn"
        centre:
          type: "number"
          description: "km/s on the crop's spectral axis; null without a resolved velocity axis"
          nullable: true
        sigma:
          type: "number"
          description: "km/s"
          nullable: true
        fwhm:
          type: "number"
          description: "2 sqrt(2 ln 2) sigma, km/s"
          nullable: true
        t_doppler_k:
          type: "number"
          description: "121.1 K (km/s)^-2 x sigma^2: an upper limit on the kinetic temperature"
          nullable: true
      required:
        - "k"
        - "amp"
        - "mean_channel_file"
        - "mean_channel"
        - "sigma_channel"
        - "valid"
        - "centre"
        - "sigma"
        - "fwhm"
        - "t_doppler_k"
    RohsaComponentsHeader:
      type: "object"
      properties:
        ok:
          type: "boolean"
        x:
          type: "integer"
        y:
          type: "integer"
        channels:
          type: "integer"
        n_gauss:
          type: "integer"
        components:
          type: "array"
          items:
            $ref: "#/components/schemas/RohsaComponent"
        axis:
          type: "object"
          properties:
            kind:
              type: "string"
              enum:
                - "velocity"
                - "channel"
            name:
              type: "string"
              nullable: true
            unit:
              type: "string"
              nullable: true
            source_unit:
              type: "string"
              nullable: true
            unit_status:
              type: "string"
              enum:
                - "declared"
                - "inferred"
                - "unresolved"
              nullable: true
            note:
              type: "string"
              nullable: true
          required:
            - "kind"
            - "name"
            - "unit"
            - "source_unit"
            - "unit_status"
            - "note"
        bunit:
          type: "string"
          nullable: true
        layout:
          type: "string"
        conventions:
          type: "object"
          additionalProperties:
            type: "string"
          description: "the conventions applied, in words: columns, 1-based mean, sigma, model, invalid components, FWHM, T_D"
      required:
        - "components"
        - "axis"
        - "channels"
        - "n_gauss"
        - "x"
        - "y"
        - "bunit"
        - "layout"
        - "conventions"
      description: "The JSON header of a rohsa components frame."
    SweepParam:
      type: "object"
      description: "One swept setting. A sweep varies one to three of them; the product of the list lengths is at most 64."
      required:
        - "key"
        - "values"
      properties:
        key:
          type: "string"
          description: "A config setting the VGT template can change (dn, ker, noise, ...)"
        label:
          type: "string"
          description: "How the owner's screen names it (for example the Greek letter); empty means the key"
        values:
          type: "array"
          items:
            type: "string"
          description: "The explicit list, as typed; never reparsed. Letters, digits and . _ + - only"
    SweepRequest:
      type: "object"
      description: "A sweep to create or preview. Nothing is submitted by either."
      required:
        - "name"
        - "params"
      properties:
        name:
          type: "string"
          description: "Starts each job's name (letters, digits, . _ -, up to 32)"
        baseJobId:
          type: "integer"
          format: "int64"
        baseRunId:
          type: "integer"
          format: "int64"
          description: "A run made by one of our jobs; its job is the base. Give baseJobId or baseRunId, not both"
        params:
          type: "array"
          items:
            $ref: "#/components/schemas/SweepParam"
        note:
          type: "string"
          description: "Why, kept with every draft (at most 500 characters)"
    Requested:
      type: "object"
      description: "What a script asks the scheduler for, read from its #SBATCH lines; zero means the script does not say"
      required:
        - "cpus"
        - "memBytes"
        - "timeSeconds"
      properties:
        cpus:
          type: "integer"
        memBytes:
          type: "integer"
          format: "int64"
        timeSeconds:
          type: "integer"
          format: "int64"
    SweepTotals:
      type: "object"
      description: "The requested resources of the drafts. Each is the largest single request; the total is the sum"
      required:
        - "jobs"
        - "cpusEach"
        - "cpusTotal"
        - "memBytesEach"
        - "memBytesTotal"
        - "timeLimitSecondsEach"
        - "timeLimitSecondsTotal"
        - "cpuSecondsAtLimit"
      properties:
        jobs:
          type: "integer"
        cpusEach:
          type: "integer"
        cpusTotal:
          type: "integer"
        memBytesEach:
          type: "integer"
          format: "int64"
        memBytesTotal:
          type: "integer"
          format: "int64"
        timeLimitSecondsEach:
          type: "integer"
          format: "int64"
        timeLimitSecondsTotal:
          type: "integer"
          format: "int64"
        cpuSecondsAtLimit:
          type: "integer"
          format: "int64"
          description: "Sum of CPUs x time limit: the most the requests could use"
    SweepEstimate:
      type: "object"
      description: "What the base job measured (ADR 0045). A guide, not a prediction: a changed parameter can change time and memory"
      required:
        - "baseJobId"
        - "baseJobName"
        - "elapsedSeconds"
        - "maxRssBytes"
        - "totalCpuSeconds"
        - "basis"
      properties:
        baseJobId:
          type: "integer"
          format: "int64"
        baseJobName:
          type: "string"
        elapsedSeconds:
          type: "integer"
          format: "int64"
        maxRssBytes:
          type: "integer"
          format: "int64"
          nullable: true
        totalCpuSeconds:
          type: "number"
          nullable: true
        basis:
          type: "string"
    SweepDraftName:
      type: "object"
      required:
        - "name"
        - "label"
        - "values"
      properties:
        name:
          type: "string"
        label:
          type: "string"
          description: "For example N = 12, λ = 10"
        values:
          type: "object"
          additionalProperties:
            type: "string"
    SweepPreview:
      type: "object"
      description: "What creating the sweep would make; nothing is stored"
      required:
        - "count"
        - "max"
        - "baseJob"
        - "jobs"
        - "totals"
        - "estimate"
      properties:
        count:
          type: "integer"
        max:
          type: "integer"
        baseJob:
          type: "object"
          required:
            - "id"
            - "name"
            - "hostId"
          properties:
            id:
              type: "integer"
              format: "int64"
            name:
              type: "string"
            hostId:
              type: "integer"
              format: "int64"
        jobs:
          type: "array"
          items:
            $ref: "#/components/schemas/SweepDraftName"
        totals:
          $ref: "#/components/schemas/SweepTotals"
        estimate:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SweepEstimate"
    SweepMember:
      type: "object"
      required:
        - "jobId"
        - "name"
        - "label"
        - "values"
        - "state"
        - "detail"
        - "runId"
        - "held"
        - "usage"
        - "requested"
      properties:
        jobId:
          type: "integer"
          format: "int64"
        name:
          type: "string"
        label:
          type: "string"
        values:
          type: "object"
          additionalProperties:
            type: "string"
        state:
          type: "string"
          enum:
            - "draft"
            - "submitting"
            - "submitted"
            - "running"
            - "completed"
            - "failed"
            - "cancelled"
        detail:
          type: "string"
        runId:
          type: "integer"
          format: "int64"
          nullable: true
        held:
          type: "boolean"
          description: "A draft edited after the owner approved the sweep: it is not submitted"
        usage:
          type: "object"
          nullable: true
          additionalProperties: true
          description: "What sacct reported when the job ended (the Job usage object); null before"
        requested:
          $ref: "#/components/schemas/Requested"
    Sweep:
      type: "object"
      description: "A grid of linked draft jobs and where it stands"
      required:
        - "id"
        - "name"
        - "hostId"
        - "baseJobId"
        - "baseRunId"
        - "params"
        - "note"
        - "state"
        - "detail"
        - "concurrency"
        - "stopOnFailure"
        - "boardId"
        - "createdAt"
        - "startedAt"
        - "jobs"
        - "counts"
        - "waitingOn"
        - "pending"
      properties:
        id:
          type: "integer"
          format: "int64"
        name:
          type: "string"
        hostId:
          type: "integer"
          format: "int64"
        baseJobId:
          type: "integer"
          format: "int64"
        baseRunId:
          type: "integer"
          format: "int64"
          nullable: true
        params:
          type: "array"
          items:
            $ref: "#/components/schemas/SweepParam"
        note:
          type: "string"
        state:
          type: "string"
          enum:
            - "draft"
            - "running"
            - "stopped"
            - "finished"
          description: "What the owner authorised: draft nothing is submitted; running approved and being submitted; stopped cancelled or stopped on a failure; finished every submittable job has been submitted. Not whether the jobs succeeded"
        detail:
          type: "string"
          description: "Why a sweep was stopped"
        concurrency:
          type: "integer"
        stopOnFailure:
          type: "boolean"
        boardId:
          type: "integer"
          format: "int64"
          nullable: true
        createdAt:
          type: "string"
          format: "date-time"
        startedAt:
          type: "string"
          format: "date-time"
          nullable: true
        jobs:
          type: "array"
          items:
            $ref: "#/components/schemas/SweepMember"
        counts:
          type: "object"
          additionalProperties:
            type: "integer"
        waitingOn:
          type: "array"
          items:
            type: "string"
          description: "Jobs that hold a slot or are held, in words, so a stall is visible"
        pending:
          type: "integer"
          description: "Drafts that will still be submitted"
    SweepList:
      type: "object"
      required:
        - "sweeps"
      properties:
        sweeps:
          type: "array"
          items:
            $ref: "#/components/schemas/Sweep"
    SweepDiffLine:
      type: "object"
      required:
        - "op"
        - "kind"
        - "text"
      properties:
        op:
          type: "string"
          enum:
            - "-"
            - "+"
        kind:
          type: "string"
          enum:
            - "parameter"
            - "output"
            - "name"
            - "other"
          description: "Why the line differs from the base; other is never expected"
        text:
          type: "string"
    SweepReviewJob:
      type: "object"
      required:
        - "jobId"
        - "name"
        - "label"
        - "values"
        - "scriptHash"
        - "script"
        - "diff"
        - "unexpected"
        - "requested"
      properties:
        jobId:
          type: "integer"
          format: "int64"
        name:
          type: "string"
        label:
          type: "string"
        values:
          type: "object"
          additionalProperties:
            type: "string"
        scriptHash:
          type: "string"
        script:
          type: "string"
        diff:
          type: "array"
          items:
            $ref: "#/components/schemas/SweepDiffLine"
        unexpected:
          type: "integer"
          description: "Differing lines that are not a swept setting, the output folder or the job name"
        requested:
          $ref: "#/components/schemas/Requested"
    SweepReview:
      type: "object"
      description: "The scripts of the drafts still to be submitted, how each differs from the base, and what they request"
      required:
        - "sweep"
        - "baseJobId"
        - "baseName"
        - "baseScript"
        - "keys"
        - "jobs"
        - "sweepHash"
        - "totals"
        - "estimate"
        - "maxConcurrency"
      properties:
        sweep:
          $ref: "#/components/schemas/Sweep"
        baseJobId:
          type: "integer"
          format: "int64"
        baseName:
          type: "string"
        baseScript:
          type: "string"
        keys:
          type: "array"
          items:
            type: "string"
        jobs:
          type: "array"
          items:
            $ref: "#/components/schemas/SweepReviewJob"
        sweepHash:
          type: "string"
          description: "Names the exact scripts shown; approval must quote it"
        totals:
          $ref: "#/components/schemas/SweepTotals"
        estimate:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SweepEstimate"
        maxConcurrency:
          type: "integer"
    SweepSubmitRequest:
      type: "object"
      required:
        - "sweepHash"
        - "concurrency"
      properties:
        sweepHash:
          type: "string"
        concurrency:
          type: "integer"
          minimum: 1
          description: "At most this many of the sweep's jobs queued or running; 1 is sequential"
        stopOnFailure:
          type: "boolean"
          description: "Stop scheduling when a job fails; default false: a failure changes nothing for the others and nothing is retried"
    SweepCancelRequest:
      type: "object"
      required: []
      properties:
        cancelRunning:
          type: "boolean"
          description: "Also ask Slurm to cancel the sweep's queued and running jobs"
    SweepMetric:
      type: "object"
      description: "A declared number of a run; value null is not recorded, never zero"
      required:
        - "key"
        - "value"
        - "unit"
        - "uncertainty"
        - "definition"
      properties:
        key:
          type: "string"
        value:
          type: "number"
          nullable: true
        unit:
          type: "string"
        uncertainty:
          type: "number"
          nullable: true
        definition:
          type: "string"
    SweepRow:
      type: "object"
      required:
        - "jobId"
        - "name"
        - "label"
        - "values"
        - "state"
        - "runId"
        - "runName"
        - "metrics"
      properties:
        jobId:
          type: "integer"
          format: "int64"
        name:
          type: "string"
        label:
          type: "string"
        values:
          type: "object"
          additionalProperties:
            type: "string"
        state:
          type: "string"
        runId:
          type: "integer"
          format: "int64"
          nullable: true
        runName:
          type: "string"
        metrics:
          type: "array"
          items:
            $ref: "#/components/schemas/SweepMetric"
    SweepMetricInfo:
      type: "object"
      required:
        - "key"
        - "unit"
        - "units"
        - "unitsDiffer"
        - "definitionsDiffer"
        - "runs"
        - "values"
      properties:
        key:
          type: "string"
        unit:
          type: "string"
          description: "Empty when the runs declared different units"
        units:
          type: "array"
          items:
            type: "string"
        unitsDiffer:
          type: "boolean"
          description: "The runs declared different units: not one quantity, so not plotted"
        definitionsDiffer:
          type: "boolean"
        runs:
          type: "integer"
        values:
          type: "integer"
    SweepPoint:
      type: "object"
      required:
        - "x"
        - "xNum"
        - "value"
        - "uncertainty"
        - "jobId"
      properties:
        x:
          type: "string"
        xNum:
          type: "number"
          nullable: true
        value:
          type: "number"
          nullable: true
          description: "Null is a gap: no recorded value or no run yet, never zero"
        uncertainty:
          type: "number"
          nullable: true
        jobId:
          type: "integer"
          format: "int64"
    SweepLine:
      type: "object"
      required:
        - "label"
        - "points"
      properties:
        label:
          type: "string"
        points:
          type: "array"
          items:
            $ref: "#/components/schemas/SweepPoint"
    SweepPlot:
      type: "object"
      description: "A metric against one parameter, one line per combination of the other parameters"
      required:
        - "metric"
        - "unit"
        - "xKey"
        - "xName"
        - "numeric"
        - "xValues"
        - "lines"
        - "notes"
      properties:
        metric:
          type: "string"
        unit:
          type: "string"
        xKey:
          type: "string"
        xName:
          type: "string"
        numeric:
          type: "boolean"
          description: "The x values are numbers on a numeric axis; otherwise categories in list order"
        xValues:
          type: "array"
          items:
            type: "string"
        lines:
          type: "array"
          items:
            $ref: "#/components/schemas/SweepLine"
        notes:
          type: "array"
          items:
            type: "string"
    SweepGrid:
      type: "object"
      description: "The grid as a table: one row per job in parameter order with what its run declared. No row is labelled best"
      required:
        - "sweepId"
        - "name"
        - "params"
        - "rows"
        - "metrics"
        - "plot"
        - "plotNote"
      properties:
        sweepId:
          type: "integer"
          format: "int64"
        name:
          type: "string"
        params:
          type: "array"
          items:
            $ref: "#/components/schemas/SweepParam"
        rows:
          type: "array"
          items:
            $ref: "#/components/schemas/SweepRow"
        metrics:
          type: "array"
          items:
            $ref: "#/components/schemas/SweepMetricInfo"
        plot:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SweepPlot"
        plotNote:
          type: "string"
          description: "Why no plot was drawn"
