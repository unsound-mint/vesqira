      - {name: token, in: path, required: true, schema: {type: string}}
    post:
      operationId: review_h_outcome_post_review_api_token_outcome
      x-listener: review
      responses: {'200': {description: ok}}
  /review-api/{token}/preview/{sha}:
    parameters:
      - {name: token, in: path, required: true, schema: {type: string}}
      - {name: sha, in: path, required: true, schema: {type: string}}
    get:
      operationId: review_h_preview_get_review_api_token_preview_sha
      x-listener: review
      responses: {'200': {description: ok}}
components:
  schemas:
    Error:
      type: "object"
      required:
        - "error"
      properties:
        error:
          type: "string"
        reasons:
          type: "array"
          items:
            type: "string"
    Axis:
      type: "object"
      required:
        - "axis"
        - "length"
        - "ctype"
        - "ctype_status"
        - "cunit"
        - "cunit_status"
        - "crval"
        - "crval_status"
        - "crpix"
        - "crpix_status"
        - "cdelt"
        - "cdelt_status"
      description: "One FITS axis as the file declares it. A status of unresolved means the keyword is absent; the value is then null, never a default."
      properties:
        axis:
          type: "integer"
          description: "1-based FITS axis number"
        length:
          type: "integer"
        ctype:
          type: "string"
          nullable: true
        ctype_status:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
        cunit:
          type: "string"
          nullable: true
        cunit_status:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
        crval:
          type: "number"
          nullable: true
        crval_status:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
        crpix:
          type: "number"
          nullable: true
        crpix_status:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
        cdelt:
          type: "number"
          nullable: true
        cdelt_status:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
    Beam:
      type: "object"
      required:
        - "status"
      properties:
        bmaj:
          type: "number"
        bmin:
          type: "number"
        bpa:
          type: "number"
        status:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
        note:
          type: "string"
    FitsHeader:
      type: "object"
      description: "Header facts the worker read from the file when it was registered. Extra keys may be present and are not part of the contract."
      required:
        - "naxis"
        - "bitpix"
        - "axes"
        - "bunit"
        - "bunit_status"
        - "specsys"
        - "radesys"
      properties:
        naxis:
          type: "integer"
        bitpix:
          type: "integer"
          nullable: true
        axes:
          type: "array"
          items:
            $ref: "#/components/schemas/Axis"
        bunit:
          type: "string"
          nullable: true
        bunit_status:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
        specsys:
          type: "string"
          nullable: true
        radesys:
          type: "string"
          nullable: true
        beam:
          $ref: "#/components/schemas/Beam"
    Interpretation:
      type: "object"
      description: "What the user declared about the data; the file itself declares none of it."
      required:
        - "kind"
        - "unit"
        - "reliabilityId"
        - "declaredBy"
        - "declaredAt"
        - "stale"
      properties:
        kind:
          type: "string"
          enum:
            - "axial_orientation"
        unit:
          type: "string"
          enum:
            - "deg"
            - "rad"
        reliabilityId:
          type: "integer"
          nullable: true
          format: "int64"
        declaredBy:
          type: "string"
        declaredAt:
          type: "string"
          format: "date-time"
        stale:
          type: "boolean"
    Dataset:
      type: "object"
      description: "A registered dataset: a reference to the original file plus header facts. The file itself is never altered."
      required:
        - "id"
        - "path"
        - "name"
        - "sizeBytes"
        - "modifiedAt"
        - "addedAt"
        - "header"
        - "hostId"
        - "nature"
        - "interpretation"
        - "unitDeclaration"
      properties:
        id:
          type: "integer"
          format: "int64"
        path:
          type: "string"
        name:
          type: "string"
        sizeBytes:
          type: "integer"
          format: "int64"
        modifiedAt:
          type: "string"
          format: "date-time"
        addedAt:
          type: "string"
          format: "date-time"
        header:
          $ref: "#/components/schemas/FitsHeader"
        hostId:
          type: "integer"
          format: "int64"
          description: "0 for a file on this computer, otherwise the remote host that holds it"
        nature:
          type: "string"
          enum:
            - ""
            - "observed"
            - "simulated"
            - "constructed_control"
          description: "Empty means not declared"
        interpretation:
          allOf:
            - $ref: "#/components/schemas/Interpretation"
          nullable: true
        unitDeclaration:
          allOf:
            - $ref: "#/components/schemas/UnitDeclaration"
          nullable: true
          description: "Present when the person declared a unit for a file without BUNIT. The header's own bunit and bunit_status stay as the file gave them."
    DatasetList:
      type: "object"
      required:
        - "datasets"
      properties:
        datasets:
          type: "array"
          items:
            $ref: "#/components/schemas/Dataset"
    SkyPixel:
      type: "object"
      required:
        - "kind"
        - "note"
      properties:
        kind:
          type: "string"
          enum:
            - "pixel"
        note:
          type: "string"
    SkyCelestial:
      type: "object"
      required:
        - "kind"
        - "lon_name"
        - "lat_name"
        - "projection"
        - "frame"
        - "frame_status"
        - "unit"
      properties:
        kind:
          type: "string"
          enum:
            - "celestial"
        lon_name:
          type: "string"
        lat_name:
          type: "string"
        projection:
          type: "string"
          nullable: true
        frame:
          type: "string"
          nullable: true
        frame_status:
          type: "string"
          enum:
            - "declared"
            - "inferred"
            - "unresolved"
        unit:
          type: "string"
          enum:
            - "deg"
    SpectralFacts:
      type: "object"
      required:
        - "fits_axis"
        - "ctype"
        - "name"
        - "is_spectral"
        - "resolved"
        - "unit"
        - "unit_status"
        - "velocity"
      properties:
        fits_axis:
          type: "integer"
        ctype:
          type: "string"
          nullable: true
        name:
          type: "string"
        is_spectral:
          type: "boolean"
        resolved:
          type: "boolean"
        unit:
          type: "string"
          nullable: true
        unit_status:
          type: "string"
          enum:
            - "declared"
            - "inferred"
            - "unresolved"
        velocity:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
        note:
          type: "string"
        specsys:
          type: "string"
          nullable: true
        restfrq:
          type: "number"
          nullable: true
    Flags:
      type: "object"
      required:
        - "declared"
        - "channels"
      description: "Data-provider channel flags. Flagged channels keep their data; declared false means the file states no flags at all."
      properties:
        declared:
          type: "boolean"
        source:
          type: "string"
        channels:
          type: "array"
          items:
            type: "integer"
        note:
          type: "string"
    View:
      type: "object"
      description: "What the viewer needs to lay out a dataset: image size, which FITS axes are x, y and channel, and the sky and spectral readouts with their provenance."
      required:
        - "width"
        - "height"
        - "channels"
        - "bunit"
        - "bunit_status"
        - "fits_axes"
        - "sky"
        - "spectral"
        - "flags"
      properties:
        width:
          type: "integer"
        height:
          type: "integer"
        channels:
          type: "integer"
        bunit:
          type: "string"
          nullable: true
        bunit_status:
          type: "string"
          enum:
            - "declared"
            - "user"
            - "unresolved"
          description: "declared: the file's BUNIT; user: a unit the person declared for a file with none (never the file's); unresolved: neither"
        fits_axes:
          type: "object"
          required:
            - "x"
            - "y"
            - "channel"
          properties:
            x:
              type: "integer"
            y:
              type: "integer"
            channel:
              type: "integer"
              nullable: true
        sky:
          oneOf:
            - $ref: "#/components/schemas/SkyPixel"
            - $ref: "#/components/schemas/SkyCelestial"
          discriminator:
            propertyName: "kind"
            mapping:
              pixel: "#/components/schemas/SkyPixel"
              celestial: "#/components/schemas/SkyCelestial"
        spectral:
          allOf:
            - $ref: "#/components/schemas/SpectralFacts"
          nullable: true
        flags:
          $ref: "#/components/schemas/Flags"
    PlaneStats:
      type: "object"
      required:
        - "finite_count"
        - "nonfinite_count"
        - "min"
        - "max"
        - "p01"
        - "p99"
        - "overflow_count"
      properties:
        finite_count:
          type: "integer"
        nonfinite_count:
          type: "integer"
        min:
          type: "number"
          nullable: true
        max:
          type: "number"
          nullable: true
        p01:
          type: "number"
          nullable: true
        p99:
          type: "number"
          nullable: true
        overflow_count:
          type: "integer"
    PlaneHeader:
      type: "object"
      description: "The JSON header of a plane frame. NaN in the payload means no value, never zero. Extra keys may be present and are not part of the contract."
      required:
        - "width"
        - "height"
        - "channel"
        - "channels"
        - "nan_meaning"
        - "stats"
        - "spectral_value"
        - "spectral_unit"
        - "flagged"
        - "source_bitpix"
        - "scaled"
      properties:
        width:
          type: "integer"
        height:
          type: "integer"
        channel:
          type: "integer"
        channels:
          type: "integer"
        nan_meaning:
          type: "string"
        stats:
          $ref: "#/components/schemas/PlaneStats"
        spectral_value:
          type: "number"
          nullable: true
        spectral_unit:
          type: "string"
          nullable: true
        flagged:
          type: "boolean"
          nullable: true
          description: "null means the file declares no flags at all, which is not the same as not flagged."
        source_bitpix:
          type: "integer"
          nullable: true
        scaled:
          type: "boolean"
        preview:
          type: "object"
          nullable: true
          description: "Present on a reduced display preview: not for measurement; the full-resolution plane follows."
          required:
            - "step"
            - "source_width"
            - "source_height"
            - "method"
          properties:
            step:
              type: "integer"
            source_width:
              type: "integer"
            source_height:
              type: "integer"
            method:
              type: "string"
    UnitDeclaration:
      type: "object"
      description: "The physical unit a person declared for a file whose header has no BUNIT. An overlay: the file and its header facts are never changed, and wherever the unit is shown it is labelled as declared by the person."
      required:
        - "unit"
        - "declaredBy"
        - "declaredAt"
        - "stale"
      properties:
        unit:
          type: "string"
          description: "As typed: 1 to 40 printable characters. It is shown and compared as text and not converted."
        declaredBy:
          type: "string"
          description: "\"user\""
        declaredAt:
          type: "string"
          format: "date-time"
        stale:
          type: "boolean"
          description: "The file's size or modification time differs from when the unit was declared: it may no longer describe these bytes."
    Capabilities:
      type: "object"
      description: "What this running server can do, so a client can show a feature as unavailable instead of failing on a 404."
      required:
        - "app"
        - "protocol"
        - "schema"
        - "features"
        - "limits"
      properties:
        app:
          type: "object"
          required:
            - "name"
            - "version"
          properties:
            name:
              type: "string"
            version:
              type: "string"
              description: "\"dev\" for a plain build"
        protocol:
          type: "integer"
          description: "Changes only when an existing route or field changes meaning in a way an older client would misread"
        schema:
          type: "integer"
          description: "Version of the local data schema"
        features:
          type: "object"
          required:
            - "planes"
            - "planeCache"
            - "preview"
            - "hosts"
            - "jobs"
            - "analysis"
            - "remoteAnalysis"
            - "runs"
            - "boards"
            - "regions"
            - "audit"
            - "editor"
          properties:
            planes:
              type: "boolean"
            planeCache:
              type: "boolean"
            preview:
              type: "boolean"
            hosts:
              type: "boolean"
            jobs:
              type: "boolean"
            analysis:
              type: "boolean"
            remoteAnalysis:
              type: "boolean"
            runs:
              type: "boolean"
            boards:
              type: "boolean"
            regions:
              type: "boolean"
            audit:
              type: "boolean"
            editor:
              type: "boolean"
              description: "The text editor for local files is on (--enable-editor, ADR 0029)."
          description: "True when this running server was started with what the feature needs"
        limits:
          type: "object"
          required:
            - "previewStepMax"
            - "metricsPerRunMax"
          properties:
            previewStepMax:
              type: "integer"
            metricsPerRunMax:
              type: "integer"
    FigureAxis:
      type: "object"
      description: "An axis as the file declared it; null means the file did not say."
      required:
        - "axis"
        - "length"
        - "ctype"
        - "cunit"
        - "crval"
        - "cdelt"
      properties:
        axis:
          type: "integer"
        length:
          type: "integer"
        ctype:
          type: "string"
          nullable: true
        cunit:
          type: "string"
          nullable: true
        crval:
          type: "number"
          nullable: true
        cdelt:
          type: "number"
          nullable: true
    FigureHeader:
      type: "object"
      description: "Header facts declared by the file and not verified; null means absent."
      required:
        - "axes"
        - "bunit"
        - "radesys"
        - "specsys"
        - "bitpix"
      properties:
        axes:
          type: "array"
          items:
            $ref: "#/components/schemas/FigureAxis"
        bunit:
          type: "string"
          nullable: true
        radesys:
          type: "string"
          nullable: true
        specsys:
          type: "string"
          nullable: true
        bitpix:
          type: "integer"
          nullable: true
    FigureRegion:
      type: "object"
      description: "Pixel region; rect uses x0,y0,x1,y1 and circle uses cx,cy,r."
      required:
        - "shape"
      properties:
        shape:
          type: "string"
          enum:
            - "rect"
            - "circle"
        x0:
          type: "integer"
        y0:
          type: "integer"
        x1:
          type: "integer"
        y1:
          type: "integer"
        cx:
          type: "integer"
        cy:
          type: "integer"
        r:
          type: "integer"
    FigureView:
      type: "object"
      description: "What a figure shows. Unknown keys are refused, so nothing else can ride along into a reviewer's view."
      required:
        - "kind"
      properties:
        kind:
          type: "string"
          enum:
            - "plane"
            - "spectrum"
            - "orientation"
        channel:
          type: "integer"
          minimum: 0
        spectralValue:
          type: "number"
        spectralUnit:
          type: "string"
          description: "At most 16 characters of letters, digits and / * ^ . - space"
        region:
          $ref: "#/components/schemas/FigureRegion"
        colormap:
          type: "string"
          enum:
            - "viridis"
            - "inferno"
            - "gray"
            - "twilight"
        stretch:
          type: "string"
          enum:
            - "linear"
            - "sqrt"
            - "asinh"
        range:
          type: "string"
          enum:
            - "percentile"
            - "minmax"
            - "custom"
        limits:
          type: "array"
          items:
            type: "number"
          maxItems: 2
        limitsUnit:
          type: "string"
          description: "Must be the file's BUNIT, or the unit the author declared for a file without one"
        showLines:
          type: "boolean"
    FigureInterpretation:
      type: "object"
      description: "The orientation meaning declared for the file, said to be the author's or the import adapter's, never the file's."
      required:
        - "kind"
        - "unit"
        - "declaredBy"
        - "hasReliabilityMap"
      properties:
        kind:
          type: "string"
        unit:
          type: "string"
        declaredBy:
          type: "string"
        hasReliabilityMap:
          type: "boolean"
    FigureUnitDeclaration:
      type: "object"
      description: "The brightness unit the author declared because the file has no BUNIT."
      required:
        - "unit"
        - "declaredBy"
      properties:
        unit:
          type: "string"
        declaredBy:
          type: "string"
    RunParam:
      type: "object"
      required:
        - "key"
        - "value"
        - "source"
      properties:
        key:
          type: "string"
        value:
          type: "string"
        source:
          type: "string"
          enum:
            - "config"
            - "run_parameters"
    RunMetric:
      type: "object"
      description: "One measured result of a run, as the run's metadata declares it."
      required:
        - "key"
        - "value"
        - "unit"
        - "uncertainty"
        - "uncertaintyKind"
        - "n"
        - "definition"
        - "status"
      properties:
        key:
          type: "string"
        value:
          type: "number"
          nullable: true
          description: "Null when not recorded; never zero"
        unit:
          type: "string"
        uncertainty:
          type: "number"
          nullable: true
        uncertaintyKind:
          type: "string"
          enum:
            - ""
            - "standard_deviation"
            - "standard_error"
            - "confidence_68"
            - "confidence_95"
            - "other"
          description: "Empty when the run did not say; it is not guessed"
        n:
          type: "integer"
          format: "int64"
          nullable: true
        definition:
          type: "string"
        status:
          type: "string"
          enum:
            - "declared"
    RunReview:
      type: "object"
      description: "The researcher's own assessment, kept apart from whether the computation finished."
      required:
        - "qc"
        - "interpretation"
        - "note"
      properties:
        qc:
          type: "string"
          enum:
            - "not_assessed"
            - "passed"
            - "failed"
            - "inconclusive"
        interpretation:
          type: "string"
          enum:
            - "not_interpreted"
            - "supports"
            - "challenges"
            - "inconclusive"
        note:
          type: "string"
    RunSummary:
      type: "object"
      description: "The run that produced a dataset, without paths, ids or locations."
      required:
        - "name"
        - "kind"
        - "role"
        - "gitCommit"
        - "dirty"
        - "reproducibleFromCommit"
        - "generatedAt"
        - "params"
        - "metrics"
        - "review"
      properties:
        name:
          type: "string"
        kind:
          type: "string"
        role:
          type: "string"
        gitCommit:
          type: "string"
        dirty:
          type: "boolean"
        reproducibleFromCommit:
          type: "boolean"
        generatedAt:
          type: "string"
        params:
          type: "array"
          items:
            $ref: "#/components/schemas/RunParam"
        metrics:
          type: "array"
          items:
            $ref: "#/components/schemas/RunMetric"
        review:
          $ref: "#/components/schemas/RunReview"
    DerivedSummary:
      type: "object"
      description: "How a derived dataset was made; sources are file names."
      required:
        - "op"
        - "params"
        - "sources"
        - "policy"
        - "software"
        - "createdAt"
      properties:
        op:
          type: "string"
        params:
          description: "Operation parameters, as recorded; free-form JSON"
        sources:
          type: "array"
          items:
            type: "string"
        policy:
          type: "string"
        software:
          description: "Software identity, as recorded; free-form JSON"
        createdAt:
          type: "string"
          format: "date-time"
    FigureProvenance:
      type: "object"
      description: "Reviewer-safe account of where a figure came from. It has no path and no dataset id."
      required:
        - "source"
        - "view"
        - "statements"
      properties:
        source:
          type: "object"
          description: "The source file by name only; no path and no dataset id."
          required:
            - "name"
            - "sizeBytes"
            - "modifiedAt"
            - "identity"
            - "headerDeclaredByFile"
          properties:
            name:
              type: "string"
            sizeBytes:
              type: "integer"
              format: "int64"
            modifiedAt:
              type: "string"
              format: "date-time"
            identity:
              type: "string"
            headerDeclaredByFile:
              $ref: "#/components/schemas/FigureHeader"
        interpretation:
          $ref: "#/components/schemas/FigureInterpretation"
        unitDeclaration:
          $ref: "#/components/schemas/FigureUnitDeclaration"
        nature:
          type: "string"
          enum:
            - "observed"
            - "simulated"
            - "constructed_control"
          description: "As declared by the author; absent when not declared"
        run:
          $ref: "#/components/schemas/RunSummary"
        derived:
          $ref: "#/components/schemas/DerivedSummary"
        view:
          $ref: "#/components/schemas/FigureView"
        statements:
          type: "array"
          items:
            type: "string"
    Figure:
      type: "object"
      description: "Pinned evidence: the picture and the facts it was made from do not change. Title and caption are working text and may be edited."
      required:
        - "id"
        - "datasetId"
        - "title"
        - "caption"
        - "createdAt"
        - "revision"
        - "previewSha"
        - "width"
        - "height"
        - "provenance"
      properties:
        id:
          type: "integer"
          format: "int64"
        datasetId:
          type: "integer"
          format: "int64"
        title:
          type: "string"
        caption:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        revision:
          type: "string"
        previewSha:
          type: "string"
        width:
          type: "integer"
        height:
          type: "integer"
        provenance:
          $ref: "#/components/schemas/FigureProvenance"
    FigureList:
      type: "object"
      required:
        - "figures"
      properties:
        figures:
          type: "array"
          items:
            $ref: "#/components/schemas/Figure"
    CreateFigureRequest:
      type: "object"
      required:
        - "datasetId"
        - "title"
        - "view"
        - "previewPng"
      properties:
        datasetId:
          type: "integer"
          format: "int64"
        title:
          type: "string"
        caption:
          type: "string"
        view:
          $ref: "#/components/schemas/FigureView"
        previewPng:
          type: "string"
          format: "byte"
          description: "The picture as the author's browser drew it, PNG, base64"
    FigureTextRequest:
      type: "object"
      description: "Unknown keys are refused."
      required:
        - "title"
      properties:
        title:
          type: "string"
        caption:
          type: "string"
    JobProgress:
      type: "object"
      required:
        - "done"
        - "total"
        - "etaSeconds"
      properties:
        done:
          type: "integer"
        total:
          type: "integer"
        etaSeconds:
          type: "integer"
          format: "int64"
          nullable: true
          description: "An estimate at the rate so far; null when there is nothing to base it on"
    JobInfo:
      type: "object"
      description: "What the owner's board shows about a followed job. A reviewer never gets it."
      required:
        - "id"
        - "name"
        - "state"
        - "submittedAt"
        - "finishedAt"
        - "runId"
      properties:
        id:
          type: "integer"
          format: "int64"
        name:
          type: "string"
        state:
          type: "string"
          enum:
            - "draft"
            - "submitting"
            - "submitted"
            - "running"
            - "completed"
            - "failed"
            - "cancelled"
            - "unknown"
          description: "unknown when the job no longer exists"
        submittedAt:
          type: "string"
          format: "date-time"
          nullable: true
        finishedAt:
          type: "string"
          format: "date-time"
          nullable: true
        runId:
          type: "integer"
          format: "int64"
          nullable: true
        progress:
          $ref: "#/components/schemas/JobProgress"
          description: "Present only when the job's log says how far it is"
    FigureBoardItem:
      type: "object"
      required:
        - "position"
        - "kind"
        - "figure"
        - "note"
      properties:
        position:
          type: "integer"
        kind:
          type: "string"
          enum:
            - "figure"
        figure:
          $ref: "#/components/schemas/Figure"
        note:
          type: "string"
    JobBoardItem:
      type: "object"
      description: "A panel that follows a job and becomes its result when pinned."
      required:
        - "position"
        - "kind"
        - "job"
        - "note"
      properties:
        position:
          type: "integer"
        kind:
          type: "string"
          enum:
            - "job"
        job:
          $ref: "#/components/schemas/JobInfo"
        note:
          type: "string"
    BoardItem:
      oneOf:
        - $ref: "#/components/schemas/FigureBoardItem"
        - $ref: "#/components/schemas/JobBoardItem"
      discriminator:
        propertyName: "kind"
        mapping:
          figure: "#/components/schemas/FigureBoardItem"
          job: "#/components/schemas/JobBoardItem"
    Board:
      type: "object"
      required:
        - "id"
        - "title"
        - "createdAt"
        - "updatedAt"
        - "items"
      properties:
        id:
          type: "integer"
          format: "int64"
        title:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/BoardItem"
    BoardList:
      type: "object"
      required:
        - "boards"
      properties:
        boards:
          type: "array"
          items:
            $ref: "#/components/schemas/Board"
    CreateBoardRequest:
      type: "object"
      description: "Unknown keys are refused."
      required:
        - "title"
      properties:
        title:
          type: "string"
    BoardAddItemRequest:
      type: "object"
      description: "Give exactly one of figureId and jobId; both or neither is refused with 422."
      properties:
        figureId:
          type: "integer"
          format: "int64"
        jobId:
          type: "integer"
          format: "int64"
    BoardPinRequest:
      type: "object"
      description: "The figure made from the result of the job a panel follows."
      required:
        - "figureId"
      properties:
        figureId:
          type: "integer"
          format: "int64"
    BoardMoveRequest:
      type: "object"
      required:
        - "delta"
      properties:
        delta:
          type: "integer"
          enum:
            - -1
            - 1
    BoardNoteRequest:
      type: "object"
      required:
        - "note"
      properties:
        note:
          type: "string"
    Snapshot:
      type: "object"
      description: "A frozen, published version of a board. Optional fields are omitted when empty."
      required:
        - "id"
        - "boardId"
        - "label"
        - "createdAt"
        - "expiresAt"
        - "revoked"
        - "items"
        - "outcome"
        - "comments"
      properties:
        id:
          type: "integer"
          format: "int64"
        boardId:
          type: "integer"
          format: "int64"
        label:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        expiresAt:
          type: "string"
          format: "date-time"
        revoked:
          type: "boolean"
        items:
          type: "integer"
        question:
          type: "string"
        outcome:
          type: "string"
          enum:
            - ""
            - "commented"
            - "changes_requested"
            - "reviewed"
          description: "What the reviewer said about this version; empty means not yet reviewed. Not a scientific assessment of any run."
        outcomeNote:
          type: "string"
        outcomeBy:
          type: "string"
        outcomeAt:
          type: "string"
          format: "date-time"
        supersededBy:
          type: "integer"
          format: "int64"
        comments:
          type: "integer"
          description: "Reviewers' comments, not the author's replies"
        lastActivity:
          type: "string"
          format: "date-time"
    SnapshotList:
      type: "object"
      required:
        - "snapshots"
      properties:
        snapshots:
          type: "array"
          items:
            $ref: "#/components/schemas/Snapshot"
    FrozenFigure:
      type: "object"
      description: "A figure as a reviewer sees it. kind is omitted for a figure."
      required:
        - "revision"
        - "title"
        - "caption"
        - "note"
        - "previewSha"
        - "width"
        - "height"
        - "provenance"
      properties:
        kind:
          type: "string"
          enum:
            - "figure"
        revision:
          type: "string"
        title:
          type: "string"
        caption:
          type: "string"
        note:
          type: "string"
        previewSha:
          type: "string"
        width:
          type: "integer"
        height:
          type: "integer"
        provenance:
          $ref: "#/components/schemas/FigureProvenance"
    FrozenJob:
      type: "object"
      description: "A run that had not finished: only its name and state at that moment."
      required:
        - "kind"
        - "title"
        - "state"
        - "at"
        - "note"
      properties:
        kind:
          type: "string"
          enum:
            - "job"
        title:
          type: "string"
        state:
          type: "string"
          description: "As of at; it never changes"
        at:
          type: "string"
          format: "date-time"
        note:
          type: "string"
    FrozenItem:
      oneOf:
        - $ref: "#/components/schemas/FrozenFigure"
        - $ref: "#/components/schemas/FrozenJob"
    Frozen:
      type: "object"
      description: "Everything a reviewer may see of a board: there is no path, dataset id or credential field."
      required:
        - "boardTitle"
        - "label"
        - "createdAt"
        - "expiresAt"
        - "items"
      properties:
        boardTitle:
          type: "string"
        label:
          type: "string"
        question:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        expiresAt:
          type: "string"
          format: "date-time"
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/FrozenItem"
    Preflight:
      type: "object"
      description: "What publishing would expose and what a careful author would want to know first. Creates nothing."
      required:
        - "frozen"
        - "warnings"
      properties:
        frozen:
          $ref: "#/components/schemas/Frozen"
        warnings:
          type: "array"
          items:
            type: "string"
    PublishRequest:
      type: "object"
      description: "Unknown keys are refused."
      properties:
        label:
          type: "string"
        question:
          type: "string"
        hours:
          type: "number"
          description: "Lifetime of the link; 0 or absent means 14 days; beyond 90 days is refused"
        supersedes:
          type: "integer"
          format: "int64"
          description: "The snapshot this one replaces"
        reason:
          type: "string"
    PublishResponse:
      type: "object"
      required:
        - "snapshot"
        - "token"
        - "reviewPath"
        - "note"
      properties:
        snapshot:
          $ref: "#/components/schemas/Snapshot"
        token:
          type: "string"
          description: "Shown once; only its hash is kept"
        reviewPath:
          type: "string"
        note:
          type: "string"
    TextVersion:
      type: "object"
      required:
        - "size"
        - "mtime"
        - "sha256"
      description: "A text file as the editor saw it (ADR 0029). A save must send these three values from when the file was opened; all three must still match the file on disk."
      properties:
        size:
          type: "integer"
          format: "int64"
          description: "bytes"
        mtime:
          type: "string"
          description: "modification time in nanoseconds since the epoch, as a decimal string (a JSON number would lose digits in a browser)"
        sha256:
          type: "string"
          description: "hex SHA-256 of the file bytes"
    TextFile:
      type: "object"
      required:
        - "path"
        - "name"
        - "content"
        - "size"
        - "mtime"
        - "sha256"
      description: "A text file inside a source root, opened for editing."
      properties:
        path:
          type: "string"
          description: "canonical path, symbolic links resolved"
        name:
          type: "string"
        content:
          type: "string"
          description: "UTF-8 text, at most 2 MiB"
        size:
          type: "integer"
          format: "int64"
        mtime:
          type: "string"
        sha256:
          type: "string"
    TextSave:
      type: "object"
      required:
        - "path"
        - "content"
        - "base"
      properties:
        path:
          type: "string"
          description: "absolute path of an existing file; a save never creates one"
        content:
          type: "string"
        base:
          $ref: "#/components/schemas/TextVersion"
    TextConflict:
      type: "object"
      required:
        - "error"
        - "current"
      description: "The file changed on disk since it was opened. Nothing was written; current is what is on disk now."
      properties:
        error:
          type: "string"
        current:
          $ref: "#/components/schemas/TextFile"
