          required: true
          schema:
            type: "integer"
            format: "int64"
        - name: "channel"
          in: "query"
          required: true
          schema:
            type: "integer"
            minimum: 0
        - name: "step"
          in: "query"
          required: false
          description: "Reduction factor for a display preview; refused for an orientation map"
          schema:
            type: "integer"
            minimum: 1
            maximum: 64
      responses:
        "200":
          description: "ok"
          headers:
            Cache-Control:
              schema:
                type: "string"
                enum:
                  - "no-store"
            X-Content-Type-Options:
              schema:
                type: "string"
                enum:
                  - "nosniff"
          content:
            "application/vnd.vesqira.plane":
              schema:
                type: "string"
                format: "binary"
              x-frame-header:
                $ref: "#/components/schemas/PlaneHeader"
        default:
          description: "Error"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
