          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: owner_s_putText_put_api_files_text
      x-listener: owner
      summary: "Save a text file atomically, only if it is unchanged since it was opened (only with --enable-editor)"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/TextSave"
      responses:
        "200":
          description: "saved; the answer is the new base"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/TextFile"
        "400":
          description: "bad request (missing base)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "foreign Host, cross-site or cross-origin request"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "not an existing file inside a readable folder (also: outside the roots, symbolic-link escape, credential folders)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "changed on disk since it was opened; nothing written"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/TextConflict"
        "413":
          description: "larger than 2 MiB"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: "not editable text: FITS, binary, invalid UTF-8, or an extension the editor does not open"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
