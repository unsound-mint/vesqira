  /review-api/{token}:
    parameters:
      - {name: token, in: path, required: true, schema: {type: string}}
    get:
      operationId: review_h_snapshot_get_review_api_token
      x-listener: review
      summary: "The frozen board a reviewer opens, with its comments and outcome"
      parameters:
        - name: "token"
          in: "path"
          required: true
          description: "The review link's secret; an unknown, expired or revoked one is the same 404"
          schema:
            type: "string"
            minLength: 20
            maxLength: 100
      responses:
        "200":
          description: "ok"
          headers:
            Cache-Control:
              schema:
                type: "string"
                enum:
                  - "no-store"
            Referrer-Policy:
              schema:
                type: "string"
                enum:
                  - "no-referrer"
            X-Content-Type-Options:
              schema:
                type: "string"
                enum:
                  - "nosniff"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Review"
        "404":
          description: "Unknown, expired or revoked link (always the same body)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Too many failed links from this address; plain text, not the Error shape"
          headers:
            Retry-After:
              schema:
                type: "string"
          content:
            "text/plain":
              schema:
                type: "string"
        default:
          description: "Plain text, not the Error shape: 400 (bad body), 415 (not application/json), 500"
          content:
            "text/plain":
              schema:
                type: "string"
  /review-api/{token}/comments:
