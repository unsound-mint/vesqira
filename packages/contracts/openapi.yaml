components:
  schemas:
    Error:
      type: "object"
      required:
        - "error"
      properties:
        error:
          type: "string"
        reasons:
          type: "array"
          items:
            type: "string"
    Axis:
      type: "object"
      required:
        - "axis"
        - "length"
        - "ctype"
        - "ctype_status"
        - "cunit"
        - "cunit_status"
        - "crval"
        - "crval_status"
        - "crpix"
        - "crpix_status"
        - "cdelt"
        - "cdelt_status"
      description: "One FITS axis as the file declares it. A status of unresolved means the keyword is absent; the value is then null, never a default."
      properties:
        axis:
          type: "integer"
          description: "1-based FITS axis number"
        length:
          type: "integer"
        ctype:
          type: "string"
          nullable: true
        ctype_status:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
        cunit:
          type: "string"
          nullable: true
        cunit_status:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
        crval:
          type: "number"
          nullable: true
        crval_status:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
        crpix:
          type: "number"
          nullable: true
        crpix_status:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
        cdelt:
          type: "number"
          nullable: true
        cdelt_status:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
    Beam:
      type: "object"
      required:
        - "status"
      properties:
        bmaj:
          type: "number"
        bmin:
          type: "number"
        bpa:
          type: "number"
        status:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
        note:
          type: "string"
    FitsHeader:
      type: "object"
      description: "Header facts the worker read from the file when it was registered. Extra keys may be present and are not part of the contract."
      required:
        - "naxis"
        - "bitpix"
        - "axes"
        - "bunit"
        - "bunit_status"
        - "specsys"
        - "radesys"
      properties:
        naxis:
          type: "integer"
        bitpix:
          type: "integer"
          nullable: true
        axes:
          type: "array"
          items:
            $ref: "#/components/schemas/Axis"
        bunit:
          type: "string"
          nullable: true
        bunit_status:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
        specsys:
          type: "string"
          nullable: true
        radesys:
          type: "string"
          nullable: true
        beam:
          $ref: "#/components/schemas/Beam"
    Interpretation:
      type: "object"
      description: "What the user declared about the data; the file itself declares none of it."
      required:
        - "kind"
        - "unit"
        - "reliabilityId"
        - "declaredBy"
        - "declaredAt"
        - "stale"
      properties:
        kind:
          type: "string"
          enum:
            - "axial_orientation"
        unit:
          type: "string"
          enum:
            - "deg"
            - "rad"
        reliabilityId:
          type: "integer"
          nullable: true
          format: "int64"
        declaredBy:
          type: "string"
        declaredAt:
          type: "string"
          format: "date-time"
        stale:
          type: "boolean"
    Dataset:
      type: "object"
      description: "A registered dataset: a reference to the original file plus header facts. The file itself is never altered."
      required:
        - "id"
        - "path"
        - "name"
        - "sizeBytes"
        - "modifiedAt"
        - "addedAt"
        - "header"
        - "hostId"
        - "nature"
        - "interpretation"
      properties:
        id:
          type: "integer"
          format: "int64"
        path:
          type: "string"
        name:
          type: "string"
        sizeBytes:
          type: "integer"
          format: "int64"
        modifiedAt:
          type: "string"
          format: "date-time"
        addedAt:
          type: "string"
          format: "date-time"
        header:
          $ref: "#/components/schemas/FitsHeader"
        hostId:
          type: "integer"
          format: "int64"
          description: "0 for a file on this computer, otherwise the remote host that holds it"
        nature:
          type: "string"
          enum:
            - ""
            - "observed"
            - "simulated"
            - "constructed_control"
          description: "Empty means not declared"
        interpretation:
          allOf:
            - $ref: "#/components/schemas/Interpretation"
          nullable: true
    DatasetList:
      type: "object"
      required:
        - "datasets"
      properties:
        datasets:
          type: "array"
          items:
            $ref: "#/components/schemas/Dataset"
    SkyPixel:
      type: "object"
      required:
        - "kind"
        - "note"
      properties:
        kind:
          type: "string"
          enum:
            - "pixel"
        note:
          type: "string"
    SkyCelestial:
      type: "object"
      required:
        - "kind"
        - "lon_name"
        - "lat_name"
        - "projection"
        - "frame"
        - "frame_status"
        - "unit"
      properties:
        kind:
          type: "string"
          enum:
            - "celestial"
        lon_name:
          type: "string"
        lat_name:
          type: "string"
        projection:
          type: "string"
          nullable: true
        frame:
          type: "string"
          nullable: true
        frame_status:
          type: "string"
          enum:
            - "declared"
            - "inferred"
            - "unresolved"
        unit:
          type: "string"
          enum:
            - "deg"
    SpectralFacts:
      type: "object"
      required:
        - "fits_axis"
        - "ctype"
        - "name"
        - "is_spectral"
        - "resolved"
        - "unit"
        - "unit_status"
        - "velocity"
      properties:
        fits_axis:
          type: "integer"
        ctype:
          type: "string"
          nullable: true
        name:
          type: "string"
        is_spectral:
          type: "boolean"
        resolved:
          type: "boolean"
        unit:
          type: "string"
          nullable: true
        unit_status:
          type: "string"
          enum:
            - "declared"
            - "inferred"
            - "unresolved"
        velocity:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
        note:
          type: "string"
        specsys:
          type: "string"
          nullable: true
        restfrq:
          type: "number"
          nullable: true
    Flags:
      type: "object"
      required:
        - "declared"
        - "channels"
      description: "Data-provider channel flags. Flagged channels keep their data; declared false means the file states no flags at all."
      properties:
        declared:
          type: "boolean"
        source:
          type: "string"
        channels:
          type: "array"
          items:
            type: "integer"
        note:
          type: "string"
    View:
      type: "object"
      description: "What the viewer needs to lay out a dataset: image size, which FITS axes are x, y and channel, and the sky and spectral readouts with their provenance."
      required:
        - "width"
        - "height"
        - "channels"
        - "bunit"
        - "bunit_status"
        - "fits_axes"
        - "sky"
        - "spectral"
        - "flags"
      properties:
        width:
          type: "integer"
        height:
          type: "integer"
        channels:
          type: "integer"
        bunit:
          type: "string"
          nullable: true
        bunit_status:
          type: "string"
          enum:
            - "declared"
            - "unresolved"
        fits_axes:
          type: "object"
          required:
            - "x"
            - "y"
            - "channel"
          properties:
            x:
              type: "integer"
            y:
              type: "integer"
            channel:
              type: "integer"
              nullable: true
        sky:
          oneOf:
            - $ref: "#/components/schemas/SkyPixel"
            - $ref: "#/components/schemas/SkyCelestial"
          discriminator:
            propertyName: "kind"
            mapping:
              pixel: "#/components/schemas/SkyPixel"
              celestial: "#/components/schemas/SkyCelestial"
        spectral:
          allOf:
            - $ref: "#/components/schemas/SpectralFacts"
          nullable: true
        flags:
          $ref: "#/components/schemas/Flags"
    PlaneStats:
      type: "object"
      required:
        - "finite_count"
        - "nonfinite_count"
        - "min"
        - "max"
        - "p01"
        - "p99"
        - "overflow_count"
      properties:
        finite_count:
          type: "integer"
        nonfinite_count:
          type: "integer"
        min:
          type: "number"
          nullable: true
        max:
          type: "number"
          nullable: true
        p01:
          type: "number"
          nullable: true
        p99:
          type: "number"
          nullable: true
        overflow_count:
          type: "integer"
    PlaneHeader:
      type: "object"
      description: "The JSON header of a plane frame. NaN in the payload means no value, never zero. Extra keys may be present and are not part of the contract."
      required:
        - "width"
        - "height"
        - "channel"
        - "channels"
        - "nan_meaning"
        - "stats"
        - "spectral_value"
        - "spectral_unit"
        - "flagged"
        - "source_bitpix"
        - "scaled"
      properties:
        width:
          type: "integer"
        height:
          type: "integer"
        channel:
          type: "integer"
        channels:
          type: "integer"
        nan_meaning:
          type: "string"
        stats:
          $ref: "#/components/schemas/PlaneStats"
        spectral_value:
          type: "number"
          nullable: true
        spectral_unit:
          type: "string"
          nullable: true
        flagged:
          type: "boolean"
          nullable: true
          description: "null means the file declares no flags at all, which is not the same as not flagged."
        source_bitpix:
          type: "integer"
          nullable: true
        scaled:
          type: "boolean"
        preview:
          type: "object"
          nullable: true
          description: "Present on a reduced display preview: not for measurement; the full-resolution plane follows."
          required:
            - "step"
            - "source_width"
            - "source_height"
            - "method"
          properties:
            step:
              type: "integer"
            source_width:
              type: "integer"
            source_height:
              type: "integer"
            method:
              type: "string"
