[package]
name = "vesqira-desktop"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Native window for Vesqira: starts the local server and shows the web app in it."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
